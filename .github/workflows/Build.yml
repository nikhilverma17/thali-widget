          cat > app/src/main/java/com/thali/widget/ThaliData.kt <<'THALI_EOF'
          package com.thali.widget

          import android.content.Context
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.NumberFormat
          import java.util.Locale

          /** Saved link + last fetched numbers, kept in SharedPreferences. */
          object ThaliData {
              private const val PREFS = "thali"
              private const val KEY_LINK = "link"
              private const val KEY_JSON = "json"
              private const val KEY_ERROR = "error"
              private const val KEY_FETCHED = "fetched"

              private fun prefs(ctx: Context) = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              fun link(ctx: Context): String = prefs(ctx).getString(KEY_LINK, "") ?: ""

              fun saveLink(ctx: Context, link: String) {
                  prefs(ctx).edit().putString(KEY_LINK, link.trim()).remove(KEY_JSON).remove(KEY_ERROR).apply()
              }

              /** The tracker's own address: the widget link without "?widget=…". */
              fun appUrl(ctx: Context): String = link(ctx).substringBefore("?")

              fun cached(ctx: Context): JSONObject? =
                  prefs(ctx).getString(KEY_JSON, null)?.let { runCatching { JSONObject(it) }.getOrNull() }

              fun lastError(ctx: Context): String? = prefs(ctx).getString(KEY_ERROR, null)

              fun fetchedAt(ctx: Context): Long = prefs(ctx).getLong(KEY_FETCHED, 0L)

              private const val KEY_SEED = "seed"

              /** Which suggestion to show; "Another" moves it on. */
              fun seed(ctx: Context): Int = prefs(ctx).getInt(KEY_SEED, 0)
              fun nextSeed(ctx: Context) { prefs(ctx).edit().putInt(KEY_SEED, seed(ctx) + 1).apply() }

              /** Downloads the latest numbers. Returns null on success or an error message. Call off the main thread. */
              fun refresh(ctx: Context): String? {
                  val link = link(ctx)
                  if (link.isBlank()) return "No link saved yet"
                  return try {
                      val body = httpGet(withParam(link, "s=${seed(ctx)}"))
                      val json = try {
                          JSONObject(body)
                      } catch (e: Exception) {
                          throw IllegalStateException(
                              if (body.contains("accounts.google.com") || body.contains("<html", true))
                                  "The link opened a Google page instead of your numbers. Redeploy the web app with access set to Anyone."
                              else "The link didn’t return Thali data. Copy it again from the Me tab."
                          )
                      }
                      if (json.has("error")) throw IllegalStateException("Link not valid: make a new one on the Me tab.")
                      prefs(ctx).edit()
                          .putString(KEY_JSON, json.toString())
                          .putLong(KEY_FETCHED, System.currentTimeMillis())
                          .remove(KEY_ERROR)
                          .apply()
                      null
                  } catch (e: Exception) {
                      val msg = e.message ?: "Couldn’t reach Thali. Check your internet."
                      prefs(ctx).edit().putString(KEY_ERROR, msg).apply()
                      msg
                  }
              }

              /** Adds water for today through the widget link, then saves the new numbers. Call off the main thread. */
              fun addWater(ctx: Context, ml: Int): String? {
                  val link = link(ctx)
                  if (link.isBlank()) return "No link saved yet"
                  return try {
                      val json = JSONObject(httpGet(withParam(link, "addWater=$ml&s=${seed(ctx)}")))
                      if (json.has("error")) throw IllegalStateException(json.optString("error"))
                      prefs(ctx).edit().putString(KEY_JSON, json.toString())
                          .putLong(KEY_FETCHED, System.currentTimeMillis()).remove(KEY_ERROR).apply()
                      null
                  } catch (e: Exception) {
                      val msg = e.message ?: "Couldn’t add water. Check your internet."
                      prefs(ctx).edit().putString(KEY_ERROR, msg).apply()
                      msg
                  }
              }

              /** Shows added water on the widget straight away, before the server confirms it. */
              fun bumpWater(ctx: Context, ml: Int) {
                  val d = cached(ctx) ?: return
                  val water = d.optInt("water") + ml
                  val goal = d.optInt("waterGoal", 2500).coerceAtLeast(1)
                  d.put("water", water)
                  d.put("waterPercent", water * 100 / goal)
                  prefs(ctx).edit().putString(KEY_JSON, d.toString()).apply()
              }

              private fun withParam(link: String, p: String) = if (link.contains("?")) "$link&$p" else "$link?$p"

              private fun httpGet(start: String): String {
                  var url = start
                  repeat(6) {
                      val conn = (URL(url).openConnection() as HttpURLConnection).apply {
                          instanceFollowRedirects = false
                          connectTimeout = 20000
                          readTimeout = 20000
                          setRequestProperty("User-Agent", "ThaliWidget/1.0 (Android)")
                      }
                      try {
                          val code = conn.responseCode
                          if (code in 300..399) {
                              val next = conn.getHeaderField("Location") ?: throw IllegalStateException("Redirect without a target")
                              url = URL(URL(url), next).toString()
                              return@repeat
                          }
                          if (code !in 200..299) throw IllegalStateException("Server answered $code. Check the link.")
                          return conn.inputStream.bufferedReader().use { it.readText() }
                      } finally {
                          conn.disconnect()
                      }
                  }
                  throw IllegalStateException("Too many redirects")
              }

              private val nf: NumberFormat = NumberFormat.getIntegerInstance(Locale("en", "IN"))
              fun fmt(n: Int): String = nf.format(n)

              /** 34.0 -> "34", 34.5 -> "34.5" */
              fun fmt1(n: Double): String = if (n % 1.0 == 0.0) nf.format(n.toLong()) else String.format(Locale.US, "%.1f", n)

              /** 1500 -> "1.5 L", 750 -> "0.75 L" */
              fun litres(ml: Int): String {
                  val l = ml / 1000.0
                  return (if (ml % 100 == 0) String.format(Locale.US, "%.1f", l) else String.format(Locale.US, "%.2f", l)) + " L"
              }
          }
          THALI_EOF

