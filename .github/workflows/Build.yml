                          android:textColor="@color/ink"
                          android:textSize="14sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:gravity="center_horizontal"
                      android:orientation="vertical">

                      <FrameLayout
                          android:layout_width="78dp"
                          android:layout_height="78dp">

                          <ProgressBar
                              android:id="@+id/water_ring"
                              style="@android:style/Widget.ProgressBar.Horizontal"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:indeterminate="false"
                              android:max="100"
                              android:progress="0"
                              android:progressDrawable="@drawable/ring_water" />

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:gravity="center"
                              android:orientation="vertical">

                              <TextView
                                  android:id="@+id/water_val"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:includeFontPadding="false"
                                  android:maxLines="1"
                                  android:text="–"
                                  android:textColor="@color/ink"
                                  android:textSize="17sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:id="@+id/water_sub"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="1dp"
                                  android:includeFontPadding="false"
                                  android:maxLines="1"
                                  android:textColor="@color/muted"
                                  android:textSize="12sp" />
                          </LinearLayout>
                      </FrameLayout>

                      <TextView
                          android:id="@+id/water_label"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="6dp"
                          android:text="Water"
                          android:textColor="@color/ink"
                          android:textSize="14sp"
                          android:textStyle="bold" />
                  </LinearLayout>
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/sugg_box"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:background="@drawable/sugg_bg"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="14dp"
                  android:paddingTop="9dp"
                  android:paddingEnd="8dp"
                  android:paddingBottom="9dp">

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:orientation="vertical">

                      <TextView
                          android:id="@+id/sugg_msg"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:ellipsize="end"
                          android:maxLines="1"
                          android:textColor="@color/muted"
                          android:textSize="12sp" />

                      <TextView
                          android:id="@+id/sugg_food"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="3dp"
                          android:ellipsize="end"
                          android:maxLines="1"
                          android:textColor="@color/ink"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/sugg_meta"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="1dp"
                          android:ellipsize="end"
                          android:maxLines="1"
                          android:textColor="@color/protein"
                          android:textSize="13sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <TextView
                      android:id="@+id/sugg_next"
                      android:layout_width="48dp"
                      android:layout_height="48dp"
                      android:layout_marginStart="8dp"
                      android:background="@drawable/round_btn"
                      android:contentDescription="@string/another"
                      android:gravity="center"
                      android:text="⟳"
                      android:textColor="@color/turmeric"
                      android:textSize="22sp"
                      android:textStyle="bold" />
              </LinearLayout>

          </LinearLayout>
          THALI_EOF

