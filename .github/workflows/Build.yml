          if [ -z "$THALI_URL" ] || [ "$THALI_URL" = "PASTE_YOUR_EXEC_LINK_HERE" ]; then
            echo "::error::Open build.yml and paste your Thali link (ending in /exec) into THALI_URL near the top."
            exit 1
          fi
          case "$THALI_URL" in https://script.google.com/*/exec) ;; *) echo "::error::THALI_URL must start with https://script.google.com/ and end with /exec"; exit 1;; esac
          sed -i "s#__THALI_URL__#$THALI_URL#" app/src/main/res/values/strings.xml
          echo "Built-in Thali link: $THALI_URL"
          echo "Project files created:"
          find . -type f | sort

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          cd project
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "================ ERROR SUMMARY ================"
            grep -B 5 -A 20 "What went wrong" "$GITHUB_WORKSPACE/build-log.txt" || tail -80 "$GITHUB_WORKSPACE/build-log.txt"
            grep -E "^e: |error:" "$GITHUB_WORKSPACE/build-log.txt" | head -40
            exit $STATUS
          fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/"
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: thali-widget-apk
          path: out/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build-log.txt
