      - name: Build debug APK
        shell: bash
        run: |
          set +e
          cd project
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "================ ERROR SUMMARY ================"
            grep -B 5 -A 20 "What went wrong" "$GITHUB_WORKSPACE/build-log.txt" || tail -80 "$GITHUB_WORKSPACE/build-log.txt"
            grep -E "^e: |error:" "$GITHUB_WORKSPACE/build-log.txt" | head -40
            exit $STATUS
          fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/"
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: thali-widget-apk
          path: out/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build-log.txt
