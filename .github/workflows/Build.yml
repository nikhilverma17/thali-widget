name: Build APK
# This one file contains the whole NutriLog Android app (v6.1: app, widgets, reminders, steps counted by the phone itself, sleep via Health Connect).
# It creates the project on GitHub's machine and builds the APK,
# so nothing else needs to be uploaded to the repository.

on:
  push:
  workflow_dispatch:

env:
  # >>> Paste your Thali web app link (the one ending in /exec) between the quotes, then commit. <<<
  THALI_URL: 'https://script.google.com/a/macros/emversity.com/s/AKfycbxRCXDi5pkiTmj0Oj7yL8Q1YQHFqKJo1BGrD_fYOBSWS78x9rKRHSnhqJZELHPwQH8aTA/exec'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p project && cd project
          mkdir -p app
          cat > app/build.gradle.kts <<'THALI_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.thali.widget"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.thali.widget"
                  minSdk = 28
                  targetSdk = 34
                  versionCode = 12
                  versionName = "6.1"
              }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.work:work-runtime-ktx:2.9.1")
              implementation("androidx.health.connect:connect-client:1.1.0-alpha07")
              implementation("androidx.activity:activity-ktx:1.8.2")
          }
          THALI_EOF

          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'THALI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-feature android:name="android.hardware.sensor.stepcounter" android:required="false" />
              <uses-permission android:name="android.permission.health.READ_STEPS" />
              <uses-permission android:name="android.permission.health.READ_DISTANCE" />
              <uses-permission android:name="android.permission.health.READ_ACTIVE_CALORIES_BURNED" />
              <uses-permission android:name="android.permission.health.READ_SLEEP" />
              <uses-permission android:name="android.permission.health.READ_EXERCISE" />

              <queries>
                  <package android:name="com.google.android.apps.healthdata" />
              </queries>

              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:allowBackup="true">

                  <activity
                      android:name=".AppActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <meta-data
                          android:name="android.app.shortcuts"
                          android:resource="@xml/shortcuts" />
                  </activity>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="@string/settings_label"
                      android:windowSoftInputMode="adjustResize" />

                  <receiver
                      android:name=".ThaliWidget"
                      android:exported="true"
                      android:label="@string/widget_name">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/thali_widget_info" />
                  </receiver>
                  <receiver
                      android:name=".ThaliSuggestWidget"
                      android:exported="true"
                      android:label="@string/widget_suggest_name">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/thali_widget_suggest_info" />
                  </receiver>
                  <receiver
                      android:name=".CaloriesWidget"
                      android:exported="true"
                      android:label="@string/w_calories">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_calories_info" />
                  </receiver>
                  <receiver
                      android:name=".ProteinWidget"
                      android:exported="true"
                      android:label="@string/w_protein">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_protein_info" />
                  </receiver>
                  <receiver
                      android:name=".WaterWidget"
                      android:exported="true"
                      android:label="@string/w_water">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_water_info" />
                  </receiver>
                  <receiver
                      android:name=".MealsWidget"
                      android:exported="true"
                      android:label="@string/w_meals">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_meals_info" />
                  </receiver>
                  <receiver
                      android:name=".WeekWidget"
                      android:exported="true"
                      android:label="@string/w_week">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_week_info" />
                  </receiver>
                  <receiver
                      android:name=".NextMealWidget"
                      android:exported="true"
                      android:label="@string/w_next">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_next_info" />
                  </receiver>
                  <receiver
                      android:name=".StepsWidget"
                      android:exported="true"
                      android:label="@string/w_steps">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_steps_info" />
                  </receiver>
                  <!-- Reads the phone's step counter after a restart, an update and just after midnight -->
                  <receiver
                      android:name=".StepReceiver"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
                  <!-- Health Connect shows this page when someone asks how NutriLog uses their data -->
                  <activity
                      android:name=".HealthRationaleActivity"
                      android:exported="true"
                      android:label="@string/health_privacy_title">
                      <intent-filter>
                          <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE" />
                      </intent-filter>
                  </activity>

                  <!-- Android 14 and newer -->
                  <activity-alias
                      android:name="ViewPermissionUsageActivity"
                      android:exported="true"
                      android:permission="android.permission.START_VIEW_PERMISSION_USAGE"
                      android:targetActivity=".HealthRationaleActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW_PERMISSION_USAGE" />
                          <category android:name="android.intent.category.HEALTH_PERMISSIONS" />
                      </intent-filter>
                  </activity-alias>
              </application>
          </manifest>
          THALI_EOF

          mkdir -p app/src/main/java/com/thali/widget
          cat > app/src/main/java/com/thali/widget/AppActivity.kt <<'THALI_EOF'
          package com.thali.widget

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.view.View
          import android.webkit.CookieManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceError
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.ProgressBar
          import kotlinx.coroutines.runBlocking
          import kotlin.concurrent.thread

          /** The full Thali tracker, opened inside the app (no browser bar). */
          class AppActivity : Activity() {

              companion object {
                  private const val HEALTH_REQUEST = 41
                  private const val PERMISSIONS_REQUEST = 7
                  const val EXTRA_ENABLE_STEPS = "enable_steps"
              }

              private var web: WebView? = null
              private lateinit var bar: ProgressBar
              private lateinit var offline: View

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  // The Thali link is built into the app; a link saved by hand is only a fallback
                  val builtIn = getString(R.string.app_url)
                  val url = if (builtIn.startsWith("https://")) builtIn else ThaliData.appUrl(this)
                  if (!url.startsWith("http")) {
                      // No link built in and none saved: go to the setup screen
                      startActivity(Intent(this, MainActivity::class.java))
                      finish()
                      return
                  }
                  setContentView(R.layout.activity_app)
                  val w = findViewById<WebView>(R.id.web)
                  web = w
                  bar = findViewById(R.id.load_bar)
                  offline = findViewById(R.id.offline)

                  findViewById<Button>(R.id.retry).setOnClickListener {
                      offline.visibility = View.GONE
                      w.reload()
                  }
                  findViewById<Button>(R.id.settings).setOnClickListener {
                      startActivity(Intent(this, MainActivity::class.java))
                  }

                  w.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true        // keeps you signed in (the app stores its login token)
                      databaseEnabled = true
                      loadWithOverviewMode = true
                      useWideViewPort = true
                      setSupportZoom(false)
                  }
                  w.addJavascriptInterface(Bridge(), "ThaliAndroid")
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(w, true)

                  w.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val host = request.url.host ?: return false
                          val google = host.endsWith("google.com") || host.endsWith("googleusercontent.com") ||
                              host.endsWith("gstatic.com") || host.endsWith("googleapis.com")
                          if (google) return false
                          startActivity(Intent(Intent.ACTION_VIEW, request.url))   // other links open in the browser
                          return true
                      }

                      override fun onReceivedError(view: WebView, request: WebResourceRequest, error: WebResourceError) {
                          if (request.isForMainFrame) offline.visibility = View.VISIBLE
                      }
                  }
                  w.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView, newProgress: Int) {
                          bar.progress = newProgress
                          bar.visibility = if (newProgress < 100) View.VISIBLE else View.GONE
                      }
                  }
                  w.setDownloadListener { dlUrl, _, _, _, _ ->
                      if (dlUrl.startsWith("http")) startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(dlUrl)))
                  }

                  if (savedInstanceState != null) w.restoreState(savedInstanceState) else w.loadUrl(url)

                  // Reminders: create channels, schedule checks, and ask for permission once (Android 13+)
                  Notif.channels(this)
                  Reminders.schedule(this)
                  val ask = mutableListOf<String>()
                  if (Build.VERSION.SDK_INT >= 33 && !Reminders.askedPermission(this) &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      Reminders.setAskedPermission(this)
                      ask.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  // Step counting uses the phone's own step sensor. Android 10+ asks for "Physical activity" once.
                  if (Build.VERSION.SDK_INT >= 29 && Steps.hasSensor(this) && !Steps.hasPermission(this) && !Steps.askedPermission(this)) {
                      Steps.setAskedPermission(this)
                      ask.add(Manifest.permission.ACTIVITY_RECOGNITION)
                  }
                  if (ask.isNotEmpty()) requestPermissions(ask.toTypedArray(), PERMISSIONS_REQUEST)
                  Steps.start(this)
                  if (intent?.getBooleanExtra(EXTRA_ENABLE_STEPS, false) == true) enableSteps()
              }

              /** Asks for the step permission, or opens the app's settings page if it was refused twice. */
              private fun enableSteps() {
                  if (Steps.status(this) != "no_permission") return
                  if (Build.VERSION.SDK_INT >= 29 && (!Steps.askedPermission(this) || shouldShowRequestPermissionRationale(Manifest.permission.ACTIVITY_RECOGNITION))) {
                      Steps.setAskedPermission(this)
                      requestPermissions(arrayOf(Manifest.permission.ACTIVITY_RECOGNITION), PERMISSIONS_REQUEST)
                  } else {
                      startActivity(Intent(android.provider.Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:$packageName")))
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == PERMISSIONS_REQUEST && Steps.status(this) == "active") {
                      Steps.start(this)
                      Steps.refreshAsync(this)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  if (Steps.status(this) == "active") Steps.runNow(this)   // fresh step count whenever the app opens
              }

              /** Called by the Thali web app (Index.html) running inside this app. */
              inner class Bridge {
                  /** After sign-in the web app sends this account's private widget link. */
                  @JavascriptInterface
                  fun setWidgetLink(link: String) {
                      val ctx = this@AppActivity
                      if (!link.startsWith("https://script.google.com/") || !link.contains("widget=")) return
                      if (link == ThaliData.link(ctx)) return
                      ThaliData.saveLink(ctx, link)
                      RefreshWorker.schedule(ctx)
                      RefreshWorker.runNow(ctx)
                      Reminders.schedule(ctx)
                  }

                  /** Called after every change in the app (food, water, weight, goals): refresh the widgets right away. */
                  @JavascriptInterface
                  fun dataChanged() {
                      val ctx = this@AppActivity
                      if (!ThaliData.link(ctx).contains("widget=")) return
                      ThaliWidget.updateAll(ctx, updating = true)
                      RefreshWorker.runNow(ctx)   // repeated calls replace each other, so quick edits cause one refresh
                  }

                  /** Health Connect: browser / unavailable / needs_install / no_permission / connected */
                  @JavascriptInterface
                  fun healthStatus(): String = runBlocking { Health.status(this@AppActivity) }

                  @JavascriptInterface
                  fun connectHealth() {
                      runOnUiThread {
                          try { startActivityForResult(Health.permissionIntent(this@AppActivity), HEALTH_REQUEST) }
                          catch (_: Exception) { startActivity(Health.installIntent()) }
                      }
                  }

                  @JavascriptInterface
                  fun installHealth() { runOnUiThread { startActivity(Health.installIntent()) } }

                  @JavascriptInterface
                  fun syncHealth() { startHealthSync() }

                  /** Phone step counter: active / no_permission / no_sensor */
                  @JavascriptInterface
                  fun stepsStatus(): String = Steps.status(this@AppActivity)

                  @JavascriptInterface
                  fun enableSteps() { runOnUiThread { this@AppActivity.enableSteps() } }

                  @JavascriptInterface
                  fun healthSyncState(): String = Health.syncState.get()

                  /** Signing out disconnects the widgets so they don't show the previous person's numbers. */
                  @JavascriptInterface
                  fun signedOut() {
                      val ctx = this@AppActivity
                      ThaliData.saveLink(ctx, "")
                      ThaliWidget.updateAll(ctx)
                  }
              }

              private fun startHealthSync() {
                  if (Health.syncState.get() == "syncing") return
                  Health.syncState.set("syncing")
                  thread {
                      val err = runBlocking { runCatching { Health.sync(this@AppActivity) }.getOrElse { it.message ?: "Sync failed" } }
                      Health.syncState.set(if (err == null) "done:" + System.currentTimeMillis() else "error: $err")
                      if (err == null) { ThaliWidget.updateAll(this@AppActivity) }
                  }
              }

              @Deprecated("Plain Activity result callback; works on all Android versions")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == HEALTH_REQUEST) {
                      val granted = runCatching { Health.parseResult(resultCode, data) }.getOrDefault(emptySet())
                      if (granted.isNotEmpty()) startHealthSync()
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  web?.saveState(outState)
              }

              @Deprecated("Uses the platform back behaviour on all Android versions")
              override fun onBackPressed() {
                  val w = web
                  if (w != null && w.canGoBack()) w.goBack() else super.onBackPressed()
              }

              /** Leaving the app: refresh the widget so newly logged food and water show up. */
              override fun onPause() {
                  super.onPause()
                  if (ThaliData.link(this).contains("widget=")) {
                      ThaliWidget.updateAll(this, updating = true)
                      RefreshWorker.runNow(this)
                  }
              }

              override fun onDestroy() {
                  web?.destroy()
                  web = null
                  super.onDestroy()
              }
          }
          THALI_EOF

          mkdir -p app/src/main/java/com/thali/widget
          cat > app/src/main/java/com/thali/widget/Charts.kt <<'THALI_EOF'
          package com.thali.widget

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.graphics.Typeface
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin

          /** Draws the widget charts as images (works on every Android version). */
          object Charts {
              private fun scale(ctx: Context) = min(ctx.resources.displayMetrics.density, 2.0f)

              /** Compact images (2 bytes per pixel) drawn on the widget's own background colour, so updates stay small. */
              private fun canvasFor(ctx: Context, w: Int, h: Int): Pair<Bitmap, Canvas> {
                  val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.RGB_565)
                  bmp.eraseColor(ctx.getColor(R.color.bg))
                  return bmp to Canvas(bmp)
              }

              private fun stroke(color: Int, width: Float, round: Boolean = true) = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  this.color = color; style = Paint.Style.STROKE; strokeWidth = width
                  strokeCap = if (round) Paint.Cap.ROUND else Paint.Cap.BUTT
              }

              private fun fill(color: Int) = Paint(Paint.ANTI_ALIAS_FLAG).apply { this.color = color; style = Paint.Style.FILL }

              private fun text(color: Int, size: Float, bold: Boolean) = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  this.color = color; textSize = size; textAlign = Paint.Align.CENTER
                  typeface = if (bold) Typeface.DEFAULT_BOLD else Typeface.DEFAULT
              }

              /** Donut split into coloured parts (fractions of the full circle), with text in the middle. */
              fun donut(ctx: Context, dp: Int, parts: List<Pair<Float, Int>>, track: Int, big: String, small: String,
                        bigColor: Int, smallColor: Int, goalTick: Float?, tickColor: Int): Bitmap {
                  val px = max(40, (dp * scale(ctx)).toInt())
                  val (bmp, c) = canvasFor(ctx, px, px)
                  val sw = px * 0.12f
                  val r = RectF(sw / 2 + 2, sw / 2 + 2, px - sw / 2 - 2, px - sw / 2 - 2)
                  c.drawArc(r, 0f, 360f, false, stroke(track, sw))
                  var start = -90f
                  for ((f, col) in parts) {
                      val sweep = 360f * f
                      if (sweep > 0.4f) c.drawArc(r, start, max(sweep - 1.5f, 0.4f), false, stroke(col, sw, round = false))
                      start += sweep
                  }
                  if (goalTick != null) {   // where the goal was, when over
                      val a = Math.toRadians((-90f + 360f * goalTick).toDouble())
                      val cx = px / 2f; val cy = px / 2f; val r1 = r.width() / 2 - sw * 0.75f; val r2 = r.width() / 2 + sw * 0.75f
                      c.drawLine(cx + r1 * cos(a).toFloat(), cy + r1 * sin(a).toFloat(), cx + r2 * cos(a).toFloat(), cy + r2 * sin(a).toFloat(), stroke(tickColor, px * 0.025f))
                  }
                  val tb = text(bigColor, px * 0.2f, true)
                  c.drawText(big, px / 2f, px / 2f + tb.textSize * 0.25f, tb)
                  val ts = text(smallColor, px * 0.095f, false)
                  c.drawText(small, px / 2f, px / 2f + tb.textSize * 0.25f + ts.textSize * 1.35f, ts)
                  return bmp
              }

              /** Single-colour progress ring (round ends), optional text inside. */
              fun ring(ctx: Context, dp: Int, frac: Float, color: Int, track: Int, big: String = "", bigColor: Int = color): Bitmap {
                  val px = max(30, (dp * scale(ctx)).toInt())
                  val (bmp, c) = canvasFor(ctx, px, px)
                  val sw = px * 0.13f
                  val r = RectF(sw / 2 + 1, sw / 2 + 1, px - sw / 2 - 1, px - sw / 2 - 1)
                  c.drawArc(r, 0f, 360f, false, stroke(track, sw))
                  val f = frac.coerceIn(0f, 1f)
                  if (f > 0.005f) c.drawArc(r, -90f, 360f * f, false, stroke(color, sw))
                  if (big.isNotEmpty()) {
                      val tb = text(bigColor, px * 0.24f, true)
                      c.drawText(big, px / 2f, px / 2f + tb.textSize * 0.35f, tb)
                  }
                  return bmp
              }

              /** Half-circle gauge with value and caption. */
              fun gauge(ctx: Context, wDp: Int, hDp: Int, frac: Float, color: Int, track: Int, big: String, small: String, bigColor: Int, smallColor: Int): Bitmap {
                  val s = scale(ctx)
                  val w = max(60, (wDp * s).toInt()); val h = max(40, (hDp * s).toInt())
                  val (bmp, c) = canvasFor(ctx, w, h)
                  val d = min(w * 0.95f, h * 1.7f)
                  val sw = d * 0.12f
                  val left = (w - d) / 2 + sw / 2; val top = sw / 2 + 2
                  val r = RectF(left, top, left + d - sw, top + d - sw)
                  c.drawArc(r, 180f, 180f, false, stroke(track, sw))
                  val f = frac.coerceIn(0f, 1f)
                  if (f > 0.005f) c.drawArc(r, 180f, 180f * f, false, stroke(color, sw))
                  val tb = text(bigColor, d * 0.17f, true)
                  val baseY = top + (d - sw) / 2
                  c.drawText(big, w / 2f, baseY - d * 0.02f, tb)
                  val ts = text(smallColor, d * 0.085f, false)
                  c.drawText(small, w / 2f, baseY + ts.textSize * 1.2f, ts)
                  return bmp
              }

              /** Water bottle that fills from the bottom. */
              fun bottle(ctx: Context, wDp: Int, hDp: Int, frac: Float, water: Int, soft: Int, outline: Int): Bitmap {
                  val s = scale(ctx)
                  val w = max(30, (wDp * s).toInt()); val h = max(50, (hDp * s).toInt())
                  val (bmp, c) = canvasFor(ctx, w, h)
                  val bw = min(w * 0.8f, h * 0.48f); val x0 = (w - bw) / 2
                  val capH = h * 0.08f; val neckH = h * 0.06f
                  c.drawRoundRect(RectF(x0 + bw * 0.3f, 2f, x0 + bw * 0.7f, 2f + capH), capH * 0.3f, capH * 0.3f, fill(outline))
                  val body = RectF(x0, 2f + capH + neckH, x0 + bw, h - 2f)
                  val rad = bw * 0.28f
                  c.drawRoundRect(body, rad, rad, fill(soft))
                  val f = frac.coerceIn(0f, 1f)
                  if (f > 0f) {
                      val save = c.save()
                      val clip = Path().apply { addRoundRect(body, rad, rad, Path.Direction.CW) }
                      c.clipPath(clip)
                      val top = body.bottom - body.height() * f
                      c.drawRect(body.left, top, body.right, body.bottom, fill(water))
                      c.restoreToCount(save)
                  }
                  c.drawRoundRect(body, rad, rad, stroke(outline, max(2f, bw * 0.05f)))
                  return bmp
              }

              /** Seven-day bar chart with a dashed goal line and day letters. */
              fun bars(ctx: Context, wDp: Int, hDp: Int, values: List<Int>, labels: List<String>, goal: Int,
                       ok: Int, over: Int, empty: Int, goalColor: Int, textColor: Int, todayIndex: Int, todayColor: Int): Bitmap {
                  val s = scale(ctx)
                  val w = max(100, (wDp * s).toInt()); val h = max(50, (hDp * s).toInt())
                  val (bmp, c) = canvasFor(ctx, w, h)
                  val labelH = h * 0.2f
                  val chartH = h - labelH - 4
                  val maxV = max(goal * 1.25f, (values.maxOrNull() ?: 0).toFloat()).coerceAtLeast(1f)
                  val n = values.size.coerceAtLeast(1)
                  val slot = w.toFloat() / n
                  val bw = slot * 0.56f
                  val tl = text(textColor, labelH * 0.62f, false)
                  values.forEachIndexed { i, v ->
                      val cx = slot * i + slot / 2
                      val bh = if (v <= 0) chartH * 0.04f else chartH * (v / maxV)
                      val col = if (v <= 0) empty else if (v > goal) over else ok
                      c.drawRoundRect(RectF(cx - bw / 2, chartH - bh, cx + bw / 2, chartH), bw * 0.22f, bw * 0.22f, fill(col))
                      val lp = if (i == todayIndex) text(todayColor, labelH * 0.62f, true) else tl
                      c.drawText(labels.getOrElse(i) { "" }, cx, h - labelH * 0.2f, lp)
                  }
                  val gy = chartH - chartH * (goal / maxV)
                  val dash = stroke(goalColor, max(2f, h * 0.012f), round = false).apply { pathEffect = DashPathEffect(floatArrayOf(10f * s, 6f * s), 0f) }
                  c.drawLine(0f, gy, w.toFloat(), gy, dash)
                  return bmp
              }
          }
