          package com.thali.widget

          import android.content.Context
          import androidx.work.ExistingPeriodicWorkPolicy
          import androidx.work.PeriodicWorkRequestBuilder
          import androidx.work.WorkManager
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.TimeUnit

          /** Reminder settings (stored on the phone) and scheduling. */
          object Reminders {
              private const val PREFS = "thali_reminders"
              private const val WORK = "thali-reminders"
              private fun p(ctx: Context) = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              fun waterOn(ctx: Context) = p(ctx).getBoolean("water_on", true)
              fun everyMin(ctx: Context) = p(ctx).getInt("water_every", 90)
              fun startHour(ctx: Context) = p(ctx).getInt("start_hour", 8)
              fun endHour(ctx: Context) = p(ctx).getInt("end_hour", 22)
              fun onlyBehind(ctx: Context) = p(ctx).getBoolean("only_behind", true)
              fun mealsOn(ctx: Context) = p(ctx).getBoolean("meals_on", true)
              fun proteinOn(ctx: Context) = p(ctx).getBoolean("protein_on", true)

              fun put(ctx: Context, key: String, value: Boolean) = p(ctx).edit().putBoolean(key, value).apply()
              fun put(ctx: Context, key: String, value: Int) = p(ctx).edit().putInt(key, value).apply()

              fun lastWater(ctx: Context) = p(ctx).getLong("last_water", 0L)
              fun setLastWater(ctx: Context, t: Long = System.currentTimeMillis()) = p(ctx).edit().putLong("last_water", t).apply()

              fun today(): String = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
              fun sentToday(ctx: Context, key: String) = p(ctx).getString("sent_$key", "") == today()
              fun markSent(ctx: Context, key: String) = p(ctx).edit().putString("sent_$key", today()).apply()

              fun askedPermission(ctx: Context) = p(ctx).getBoolean("asked_permission", false)
              fun setAskedPermission(ctx: Context) = put(ctx, "asked_permission", true)

              /** Checks every 15 minutes (the shortest interval Android allows) whether a reminder is due. */
              fun schedule(ctx: Context) {
                  val wm = WorkManager.getInstance(ctx)
                  if (!waterOn(ctx) && !mealsOn(ctx) && !proteinOn(ctx)) {
                      wm.cancelUniqueWork(WORK)
                      return
                  }
                  val req = PeriodicWorkRequestBuilder<ReminderWorker>(15, TimeUnit.MINUTES).build()
                  wm.enqueueUniquePeriodicWork(WORK, ExistingPeriodicWorkPolicy.KEEP, req)
              }
          }
