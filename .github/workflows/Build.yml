name: Build APK
# This one file contains the whole Thali Widget Android app (v4.1: full Thali app, widgets and reminders).
# It creates the project on GitHub's machine and builds the APK,
# so nothing else needs to be uploaded to the repository.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p project && cd project
          mkdir -p app
          cat > app/build.gradle.kts <<'THALI_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.thali.widget"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.thali.widget"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 6
                  versionName = "4.1"
              }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.work:work-runtime-ktx:2.9.1")
          }
          THALI_EOF

          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'THALI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:allowBackup="true">

                  <activity
                      android:name=".AppActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <meta-data
                          android:name="android.app.shortcuts"
                          android:resource="@xml/shortcuts" />
                  </activity>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="@string/settings_label"
                      android:windowSoftInputMode="adjustResize" />

                  <receiver
                      android:name=".ThaliWidget"
                      android:exported="true"
                      android:label="@string/widget_name">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/thali_widget_info" />
                  </receiver>
                  <receiver
                      android:name=".ThaliSuggestWidget"
                      android:exported="true"
                      android:label="@string/widget_suggest_name">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/thali_widget_suggest_info" />
                  </receiver>
              </application>
          </manifest>
          THALI_EOF

          mkdir -p app/src/main/java/com/thali/widget
          cat > app/src/main/java/com/thali/widget/AppActivity.kt <<'THALI_EOF'
          package com.thali.widget

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.view.View
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceError
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.ProgressBar

          /** The full Thali tracker, opened inside the app (no browser bar). */
          class AppActivity : Activity() {

              private var web: WebView? = null
              private lateinit var bar: ProgressBar
              private lateinit var offline: View

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val url = ThaliData.appUrl(this)
                  if (!url.startsWith("http")) {
                      // No link yet: go to the setup screen first
                      startActivity(Intent(this, MainActivity::class.java))
                      finish()
                      return
                  }
                  setContentView(R.layout.activity_app)
                  val w = findViewById<WebView>(R.id.web)
                  web = w
                  bar = findViewById(R.id.load_bar)
                  offline = findViewById(R.id.offline)

                  findViewById<Button>(R.id.retry).setOnClickListener {
                      offline.visibility = View.GONE
                      w.reload()
                  }
                  findViewById<Button>(R.id.settings).setOnClickListener {
                      startActivity(Intent(this, MainActivity::class.java))
                  }

                  w.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true        // keeps you signed in (the app stores its login token)
                      databaseEnabled = true
                      loadWithOverviewMode = true
                      useWideViewPort = true
                      setSupportZoom(false)
                  }
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(w, true)

                  w.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val host = request.url.host ?: return false
                          val google = host.endsWith("google.com") || host.endsWith("googleusercontent.com") ||
                              host.endsWith("gstatic.com") || host.endsWith("googleapis.com")
                          if (google) return false
                          startActivity(Intent(Intent.ACTION_VIEW, request.url))   // other links open in the browser
                          return true
                      }

                      override fun onReceivedError(view: WebView, request: WebResourceRequest, error: WebResourceError) {
                          if (request.isForMainFrame) offline.visibility = View.VISIBLE
                      }
                  }
                  w.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView, newProgress: Int) {
                          bar.progress = newProgress
                          bar.visibility = if (newProgress < 100) View.VISIBLE else View.GONE
                      }
                  }
                  w.setDownloadListener { dlUrl, _, _, _, _ ->
                      if (dlUrl.startsWith("http")) startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(dlUrl)))
                  }

                  if (savedInstanceState != null) w.restoreState(savedInstanceState) else w.loadUrl(url)

                  // Reminders: create channels, schedule checks, and ask for permission once (Android 13+)
                  Notif.channels(this)
                  Reminders.schedule(this)
                  if (Build.VERSION.SDK_INT >= 33 && !Reminders.askedPermission(this) &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      Reminders.setAskedPermission(this)
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 7)
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  web?.saveState(outState)
              }

              @Deprecated("Uses the platform back behaviour on all Android versions")
              override fun onBackPressed() {
                  val w = web
                  if (w != null && w.canGoBack()) w.goBack() else super.onBackPressed()
              }

              /** Leaving the app: refresh the widget so newly logged food and water show up. */
              override fun onPause() {
                  super.onPause()
                  if (ThaliData.link(this).contains("widget=")) {
                      ThaliWidget.updateAll(this, updating = true)
                      RefreshWorker.runNow(this)
                  }
              }

              override fun onDestroy() {
                  web?.destroy()
                  web = null
                  super.onDestroy()
              }
          }
          THALI_EOF

          mkdir -p app/src/main/java/com/thali/widget
          cat > app/src/main/java/com/thali/widget/MainActivity.kt <<'THALI_EOF'
          package com.thali.widget

          import android.Manifest
          import android.app.Activity
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.view.View
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.Spinner
          import android.widget.Switch
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import kotlin.concurrent.thread

          /** One screen: paste your widget link, test it, save it. */
          class MainActivity : Activity() {

              private lateinit var input: EditText
              private lateinit var result: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  input = findViewById(R.id.link_input)
                  result = findViewById(R.id.result)
                  input.setText(ThaliData.link(this))

                  findViewById<Button>(R.id.paste).setOnClickListener {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val text = cm.primaryClip?.takeIf { it.itemCount > 0 }?.getItemAt(0)?.coerceToText(this)?.toString()
                      if (text.isNullOrBlank()) result.text = getString(R.string.clipboard_empty) else input.setText(text.trim())
                  }

                  findViewById<Button>(R.id.save).setOnClickListener { saveAndTest() }

                  findViewById<Button>(R.id.open_app).setOnClickListener {
                      if (ThaliData.appUrl(this).startsWith("http")) {
                          startActivity(Intent(this, AppActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP))
                          finish()
                      } else result.text = getString(R.string.need_link)
                  }
                  showCached()
                  setupReminders()
              }

              private fun setupReminders() {
                  Notif.channels(this)
                  val swWater = findViewById<Switch>(R.id.sw_water)
                  val swBehind = findViewById<Switch>(R.id.sw_behind)
                  val swMeals = findViewById<Switch>(R.id.sw_meals)
                  val swProtein = findViewById<Switch>(R.id.sw_protein)
                  val status = findViewById<TextView>(R.id.notif_status)

                  swWater.isChecked = Reminders.waterOn(this)
                  swBehind.isChecked = Reminders.onlyBehind(this)
                  swMeals.isChecked = Reminders.mealsOn(this)
                  swProtein.isChecked = Reminders.proteinOn(this)

                  fun changed(turnedOn: Boolean) {
                      if (turnedOn) askNotificationPermission()
                      Reminders.schedule(this)
                  }
                  swWater.setOnCheckedChangeListener { _, on -> Reminders.put(this, "water_on", on); changed(on) }
                  swBehind.setOnCheckedChangeListener { _, on -> Reminders.put(this, "only_behind", on) }
                  swMeals.setOnCheckedChangeListener { _, on -> Reminders.put(this, "meals_on", on); changed(on) }
                  swProtein.setOnCheckedChangeListener { _, on -> Reminders.put(this, "protein_on", on); changed(on) }

                  bindSpinner(R.id.sp_every, listOf(60 to "1 hour", 90 to "1.5 hours", 120 to "2 hours", 180 to "3 hours"),
                      Reminders.everyMin(this)) { Reminders.put(this, "water_every", it) }
                  bindSpinner(R.id.sp_start, (5..12).map { it to hourLabel(it) }, Reminders.startHour(this)) { Reminders.put(this, "start_hour", it) }
                  bindSpinner(R.id.sp_end, (17..24).map { it to hourLabel(it) }, Reminders.endHour(this)) { Reminders.put(this, "end_hour", it) }

                  findViewById<Button>(R.id.test_notif).setOnClickListener {
                      askNotificationPermission()
                      Reminders.schedule(this)
                      status.text = getString(if (Notif.test(this)) R.string.notif_sent else R.string.notif_blocked)
                  }
                  if (!Notif.canPost(this)) status.text = getString(R.string.notif_blocked)
              }

              private fun hourLabel(h: Int) = when {
                  h == 24 -> "midnight"
                  h == 12 -> "12 pm"
                  h > 12 -> "${h - 12} pm"
                  else -> "$h am"
              }

              private fun bindSpinner(id: Int, options: List<Pair<Int, String>>, current: Int, onPick: (Int) -> Unit) {
                  val sp = findViewById<Spinner>(id)
                  sp.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, options.map { it.second })
                  sp.setSelection(options.indexOfFirst { it.first == current }.coerceAtLeast(0))
                  sp.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, rowId: Long) = onPick(options[position].first)
                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }
              }

              private fun askNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 8)
                  }
              }

              private fun saveAndTest() {
                  val link = input.text.toString().trim()
                  if (!link.startsWith("https://script.google.com/") || !link.contains("/exec")) {
                      result.text = getString(R.string.bad_link)
                      return
                  }
                  ThaliData.saveLink(this, link)
                  result.text = getString(R.string.testing)
                  thread {
                      val err = if (link.contains("widget=")) ThaliData.refresh(this) else null
                      ThaliWidget.updateAll(this)
                      RefreshWorker.schedule(this)
                      runOnUiThread {
                          when {
                              err != null -> result.text = "Didn’t work: $err"
                              !link.contains("widget=") -> result.text = "Saved. Tap Open Thali. (For the widgets, use the widget link from the Me tab.)"
                              else -> showCached(prefix = "Saved. ")
                          }
                      }
                  }
              }

              private fun showCached(prefix: String = "") {
                  val d = ThaliData.cached(this) ?: return
                  result.text = prefix + "Hi ${d.optString("name")}! Today: ${ThaliData.fmt(d.optInt("total"))} of " +
                      "${ThaliData.fmt(d.optInt("goal"))} kcal, water ${ThaliData.fmt(d.optInt("water"))} ml.\n\n" +
                      getString(R.string.add_widget_hint)
              }
          }
          THALI_EOF

          mkdir -p app/src/main/java/com/thali/widget
          cat > app/src/main/java/com/thali/widget/Notif.kt <<'THALI_EOF'
          package com.thali.widget

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import androidx.core.app.NotificationManagerCompat
          import org.json.JSONObject

          /** Builds and posts Thali reminders. */
          object Notif {
              const val EXTRA_NOTIF = "notif_id"
              private const val CH_WATER = "water"
              private const val CH_MEALS = "meals"
              private const val ID_WATER = 101
              private const val ID_MEAL = 102
              private const val ID_PROTEIN = 105
              private const val ID_TEST = 199
              private val FLAGS = PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE

              fun channels(ctx: Context) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return
                  val nm = ctx.getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(CH_WATER, "Water reminders", NotificationManager.IMPORTANCE_DEFAULT).apply {
                      description = "Reminders to drink water during the day"
                  })
                  nm.createNotificationChannel(NotificationChannel(CH_MEALS, "Meal and protein reminders", NotificationManager.IMPORTANCE_DEFAULT).apply {
                      description = "Reminders to log meals and an evening protein check"
                  })
              }

              fun canPost(ctx: Context): Boolean {
                  if (!NotificationManagerCompat.from(ctx).areNotificationsEnabled()) return false
                  return Build.VERSION.SDK_INT < 33 ||
                      ctx.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED
              }

              private fun openApp(ctx: Context) = PendingIntent.getActivity(
                  ctx, 10, Intent(ctx, AppActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP), FLAGS)

              private fun base(ctx: Context, channel: String, title: String, text: String, colorRes: Int) =
                  NotificationCompat.Builder(ctx, channel)
                      .setSmallIcon(R.drawable.ic_notify)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(text))
                      .setColor(ctx.getColor(colorRes))
                      .setContentIntent(openApp(ctx))
                      .setAutoCancel(true)

              fun water(ctx: Context, water: Int?, goal: Int?) {
                  channels(ctx)
                  val text = if (water != null && goal != null)
                      "${ThaliData.fmt(water)} of ${ThaliData.fmt(goal)} ml so far. A glass now keeps you on track."
                  else "Time for a glass of water."
                  val b = base(ctx, CH_WATER, "Time to drink water 💧", text, R.color.water)
                  if (ThaliData.link(ctx).contains("widget=")) {
                      val add = Intent(ctx, ThaliWidget::class.java).setAction(ThaliWidget.ACTION_WATER).putExtra(EXTRA_NOTIF, ID_WATER)
                      b.addAction(0, "+ Glass (250 ml)", PendingIntent.getBroadcast(ctx, 11, add, FLAGS))
                  }
                  post(ctx, ID_WATER, b.build())
              }

              fun meal(ctx: Context, meal: String) {
                  channels(ctx)
                  post(ctx, ID_MEAL, base(ctx, CH_MEALS, "Logged your ${meal.lowercase()}? 🍽️",
                      "Add what you ate so your calories and protein stay right.", R.color.leaf).build())
              }

              fun protein(ctx: Context, protein: Double, goal: Int, suggestion: JSONObject?) {
                  channels(ctx)
                  var text = "You’re at ${ThaliData.fmt1(protein)} of $goal g protein today."
                  val sg = suggestion
                  val food = sg?.optString("food").orEmpty()
                  text += if (sg != null && food.isNotBlank() && sg.optString("mode") == "protein")
                      " Try $food (${ThaliData.fmt1(sg.optDouble("protein", 0.0))} g protein)."
                  else " Paneer, eggs, dal, sprouts or curd can help close the gap."
                  post(ctx, ID_PROTEIN, base(ctx, CH_MEALS, "Protein check 💪", text, R.color.protein).build())
              }

              fun test(ctx: Context): Boolean {
                  channels(ctx)
                  post(ctx, ID_TEST, base(ctx, CH_WATER, "Thali reminders are on 💧",
                      "This is how your water, meal and protein reminders will look.", R.color.leaf).build())
                  return canPost(ctx)
              }

              fun cancel(ctx: Context, id: Int) = NotificationManagerCompat.from(ctx).cancel(id)

              @SuppressLint("MissingPermission")
              private fun post(ctx: Context, id: Int, n: Notification) {
                  if (!canPost(ctx)) return
                  try { NotificationManagerCompat.from(ctx).notify(id, n) } catch (_: SecurityException) { }
              }
          }
          THALI_EOF

          mkdir -p app/src/main/java/com/thali/widget
          cat > app/src/main/java/com/thali/widget/RefreshWorker.kt <<'THALI_EOF'
          package com.thali.widget

          import android.content.Context
          import androidx.work.*
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.util.concurrent.TimeUnit

          /** Fetches fresh numbers (or adds water) in the background and redraws every Thali widget. */
          class RefreshWorker(ctx: Context, params: WorkerParameters) : CoroutineWorker(ctx, params) {
              override suspend fun doWork(): Result = withContext(Dispatchers.IO) {
                  val ml = inputData.getInt(KEY_WATER, 0)
                  if (ml > 0) ThaliData.addWater(applicationContext, ml) else ThaliData.refresh(applicationContext)
                  ThaliWidget.updateAll(applicationContext)
                  Result.success()
              }

              companion object {
                  private const val PERIODIC = "thali-periodic"
                  private const val NOW = "thali-now"
                  private const val WATER = "thali-water"
                  private const val KEY_WATER = "addWater"

                  private val online = Constraints.Builder().setRequiredNetworkType(NetworkType.CONNECTED).build()

                  /** Every 15 minutes (the shortest interval Android allows). */
                  fun schedule(ctx: Context) {
                      val req = PeriodicWorkRequestBuilder<RefreshWorker>(15, TimeUnit.MINUTES)
                          .setConstraints(online)
                          .build()
                      WorkManager.getInstance(ctx).enqueueUniquePeriodicWork(PERIODIC, ExistingPeriodicWorkPolicy.KEEP, req)
                  }

                  fun runNow(ctx: Context) {
                      val req = OneTimeWorkRequestBuilder<RefreshWorker>().setConstraints(online).build()
                      WorkManager.getInstance(ctx).enqueueUniqueWork(NOW, ExistingWorkPolicy.REPLACE, req)
                  }

                  /** Water taps queue up one after another so none are lost. */
                  fun addWater(ctx: Context, ml: Int) {
                      val req = OneTimeWorkRequestBuilder<RefreshWorker>()
                          .setConstraints(online)
                          .setInputData(workDataOf(KEY_WATER to ml))
                          .build()
                      WorkManager.getInstance(ctx).enqueueUniqueWork(WATER, ExistingWorkPolicy.APPEND_OR_REPLACE, req)
                  }

                  fun cancel(ctx: Context) {
                      WorkManager.getInstance(ctx).cancelUniqueWork(PERIODIC)
                  }
              }
          }
          THALI_EOF

          mkdir -p app/src/main/java/com/thali/widget
          cat > app/src/main/java/com/thali/widget/ReminderWorker.kt <<'THALI_EOF'
          package com.thali.widget

          import android.content.Context
          import androidx.work.CoroutineWorker
          import androidx.work.WorkerParameters
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.util.Calendar

          /** Decides whether a water, meal or protein reminder is due right now. */
          class ReminderWorker(ctx: Context, params: WorkerParameters) : CoroutineWorker(ctx, params) {

              override suspend fun doWork(): Result = withContext(Dispatchers.IO) {
                  val c = applicationContext
                  val cal = Calendar.getInstance()
                  val now = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE)
                  val start = Reminders.startHour(c) * 60
                  val end = Reminders.endHour(c) * 60
                  if (now < start || now >= end) return@withContext Result.success()   // quiet hours

                  // Fresh numbers from Thali when the widget link is set up
                  val hasLink = ThaliData.link(c).contains("widget=")
                  if (hasLink) {
                      ThaliData.refresh(c)
                      ThaliWidget.updateAll(c)
                  }
                  val data = if (hasLink) ThaliData.cached(c)?.takeIf { it.optString("date") == Reminders.today() } else null

                  // Water
                  if (Reminders.waterOn(c) && System.currentTimeMillis() - Reminders.lastWater(c) >= Reminders.everyMin(c) * 60_000L) {
                      val water = data?.optInt("water")
                      val goal = data?.optInt("waterGoal", 2500)
                      val reached = water != null && goal != null && water >= goal
                      val expected = if (goal != null) goal * (now - start).toDouble() / (end - start) else null
                      val behind = water == null || expected == null || water < expected - 200
                      if (!reached && (behind || !Reminders.onlyBehind(c))) {
                          Notif.water(c, water, goal)
                          Reminders.setLastWater(c)
                      } else if (reached) {
                          Reminders.setLastWater(c)   // goal done: no nagging
                      }
                  }

                  // Meals: remind only if nothing is logged for that meal yet
                  if (Reminders.mealsOn(c)) {
                      for ((meal, key, at) in listOf(Triple("Breakfast", "breakfast", 9 * 60 + 30), Triple("Lunch", "lunch", 14 * 60), Triple("Dinner", "dinner", 21 * 60))) {
                          if (now >= at && now < at + 120 && !Reminders.sentToday(c, key)) {
                              if (data == null || data.optInt(key, 0) == 0) Notif.meal(c, meal)
                              Reminders.markSent(c, key)
                          }
                      }
                  }

                  // Evening protein check
                  if (Reminders.proteinOn(c) && data != null && now >= 19 * 60 + 30 && !Reminders.sentToday(c, "protein")) {
                      val protein = data.optDouble("protein", 0.0)
                      val goal = data.optInt("proteinGoal", 60)
                      if (protein < goal * 0.7) Notif.protein(c, protein, goal, data.optJSONObject("suggestion"))
                      Reminders.markSent(c, "protein")
                  }
                  Result.success()
              }
          }
          THALI_EOF

          mkdir -p app/src/main/java/com/thali/widget
          cat > app/src/main/java/com/thali/widget/Reminders.kt <<'THALI_EOF'
          package com.thali.widget

          import android.content.Context
          import androidx.work.ExistingPeriodicWorkPolicy
          import androidx.work.PeriodicWorkRequestBuilder
          import androidx.work.WorkManager
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.TimeUnit

          /** Reminder settings (stored on the phone) and scheduling. */
          object Reminders {
              private const val PREFS = "thali_reminders"
              private const val WORK = "thali-reminders"
              private fun p(ctx: Context) = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              fun waterOn(ctx: Context) = p(ctx).getBoolean("water_on", true)
              fun everyMin(ctx: Context) = p(ctx).getInt("water_every", 90)
              fun startHour(ctx: Context) = p(ctx).getInt("start_hour", 8)
              fun endHour(ctx: Context) = p(ctx).getInt("end_hour", 22)
              fun onlyBehind(ctx: Context) = p(ctx).getBoolean("only_behind", true)
              fun mealsOn(ctx: Context) = p(ctx).getBoolean("meals_on", true)
              fun proteinOn(ctx: Context) = p(ctx).getBoolean("protein_on", true)

              fun put(ctx: Context, key: String, value: Boolean) = p(ctx).edit().putBoolean(key, value).apply()
              fun put(ctx: Context, key: String, value: Int) = p(ctx).edit().putInt(key, value).apply()

              fun lastWater(ctx: Context) = p(ctx).getLong("last_water", 0L)
              fun setLastWater(ctx: Context, t: Long = System.currentTimeMillis()) = p(ctx).edit().putLong("last_water", t).apply()

              fun today(): String = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
              fun sentToday(ctx: Context, key: String) = p(ctx).getString("sent_$key", "") == today()
              fun markSent(ctx: Context, key: String) = p(ctx).edit().putString("sent_$key", today()).apply()

              fun askedPermission(ctx: Context) = p(ctx).getBoolean("asked_permission", false)
              fun setAskedPermission(ctx: Context) = put(ctx, "asked_permission", true)

              /** Checks every 15 minutes (the shortest interval Android allows) whether a reminder is due. */
              fun schedule(ctx: Context) {
                  val wm = WorkManager.getInstance(ctx)
                  if (!waterOn(ctx) && !mealsOn(ctx) && !proteinOn(ctx)) {
                      wm.cancelUniqueWork(WORK)
                      return
                  }
                  val req = PeriodicWorkRequestBuilder<ReminderWorker>(15, TimeUnit.MINUTES).build()
                  wm.enqueueUniquePeriodicWork(WORK, ExistingPeriodicWorkPolicy.KEEP, req)
              }
          }
