name: Build APK
# This one file contains the whole Thali Widget Android app (v3.1: bigger, size-aware widgets).
# It creates the project on GitHub's machine and builds the APK,
# so nothing else needs to be uploaded to the repository.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p project && cd project
          mkdir -p app
          cat > app/build.gradle.kts <<'THALI_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.thali.widget"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.thali.widget"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 4
                  versionName = "3.1"
              }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.work:work-runtime-ktx:2.9.1")
          }
          THALI_EOF

          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'THALI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".ThaliWidget"
                      android:exported="true"
                      android:label="@string/widget_name">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/thali_widget_info" />
                  </receiver>
                  <receiver
                      android:name=".ThaliSuggestWidget"
                      android:exported="true"
                      android:label="@string/widget_suggest_name">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/thali_widget_suggest_info" />
                  </receiver>
              </application>
          </manifest>
          THALI_EOF

          mkdir -p app/src/main/java/com/thali/widget
          cat > app/src/main/java/com/thali/widget/MainActivity.kt <<'THALI_EOF'
          package com.thali.widget

          import android.app.Activity
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import kotlin.concurrent.thread

          /** One screen: paste your widget link, test it, save it. */
          class MainActivity : Activity() {

              private lateinit var input: EditText
              private lateinit var result: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  input = findViewById(R.id.link_input)
                  result = findViewById(R.id.result)
                  input.setText(ThaliData.link(this))

                  findViewById<Button>(R.id.paste).setOnClickListener {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val text = cm.primaryClip?.takeIf { it.itemCount > 0 }?.getItemAt(0)?.coerceToText(this)?.toString()
                      if (text.isNullOrBlank()) result.text = getString(R.string.clipboard_empty) else input.setText(text.trim())
                  }

                  findViewById<Button>(R.id.save).setOnClickListener { saveAndTest() }

                  findViewById<Button>(R.id.open_app).setOnClickListener {
                      val url = ThaliData.appUrl(this)
                      if (url.startsWith("http")) startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)))
                      else result.text = getString(R.string.need_link)
                  }
                  showCached()
              }

              private fun saveAndTest() {
                  val link = input.text.toString().trim()
                  if (!link.startsWith("https://script.google.com/") || !link.contains("widget=")) {
                      result.text = getString(R.string.bad_link)
                      return
                  }
                  ThaliData.saveLink(this, link)
                  result.text = getString(R.string.testing)
                  thread {
                      val err = ThaliData.refresh(this)
                      ThaliWidget.updateAll(this)
                      RefreshWorker.schedule(this)
                      runOnUiThread {
                          if (err != null) result.text = "Didn’t work: $err" else showCached(prefix = "Saved. ")
                      }
                  }
              }

              private fun showCached(prefix: String = "") {
                  val d = ThaliData.cached(this) ?: return
                  result.text = prefix + "Hi ${d.optString("name")}! Today: ${ThaliData.fmt(d.optInt("total"))} of " +
                      "${ThaliData.fmt(d.optInt("goal"))} kcal, water ${ThaliData.fmt(d.optInt("water"))} ml.\n\n" +
                      getString(R.string.add_widget_hint)
              }
          }
          THALI_EOF

          mkdir -p app/src/main/java/com/thali/widget
          cat > app/src/main/java/com/thali/widget/RefreshWorker.kt <<'THALI_EOF'
          package com.thali.widget

          import android.content.Context
          import androidx.work.*
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.util.concurrent.TimeUnit

          /** Fetches fresh numbers (or adds water) in the background and redraws every Thali widget. */
          class RefreshWorker(ctx: Context, params: WorkerParameters) : CoroutineWorker(ctx, params) {
              override suspend fun doWork(): Result = withContext(Dispatchers.IO) {
                  val ml = inputData.getInt(KEY_WATER, 0)
                  if (ml > 0) ThaliData.addWater(applicationContext, ml) else ThaliData.refresh(applicationContext)
                  ThaliWidget.updateAll(applicationContext)
                  Result.success()
              }

              companion object {
                  private const val PERIODIC = "thali-periodic"
                  private const val NOW = "thali-now"
                  private const val WATER = "thali-water"
                  private const val KEY_WATER = "addWater"

                  private val online = Constraints.Builder().setRequiredNetworkType(NetworkType.CONNECTED).build()

                  /** Every 15 minutes (the shortest interval Android allows). */
                  fun schedule(ctx: Context) {
                      val req = PeriodicWorkRequestBuilder<RefreshWorker>(15, TimeUnit.MINUTES)
                          .setConstraints(online)
                          .build()
                      WorkManager.getInstance(ctx).enqueueUniquePeriodicWork(PERIODIC, ExistingPeriodicWorkPolicy.KEEP, req)
                  }

                  fun runNow(ctx: Context) {
                      val req = OneTimeWorkRequestBuilder<RefreshWorker>().setConstraints(online).build()
                      WorkManager.getInstance(ctx).enqueueUniqueWork(NOW, ExistingWorkPolicy.REPLACE, req)
                  }

                  /** Water taps queue up one after another so none are lost. */
                  fun addWater(ctx: Context, ml: Int) {
                      val req = OneTimeWorkRequestBuilder<RefreshWorker>()
                          .setConstraints(online)
                          .setInputData(workDataOf(KEY_WATER to ml))
                          .build()
                      WorkManager.getInstance(ctx).enqueueUniqueWork(WATER, ExistingWorkPolicy.APPEND_OR_REPLACE, req)
                  }

                  fun cancel(ctx: Context) {
                      WorkManager.getInstance(ctx).cancelUniqueWork(PERIODIC)
                  }
              }
          }
          THALI_EOF

          mkdir -p app/src/main/java/com/thali/widget
          cat > app/src/main/java/com/thali/widget/ThaliData.kt <<'THALI_EOF'
          package com.thali.widget

          import android.content.Context
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.NumberFormat
          import java.util.Locale

          /** Saved link + last fetched numbers, kept in SharedPreferences. */
          object ThaliData {
              private const val PREFS = "thali"
              private const val KEY_LINK = "link"
              private const val KEY_JSON = "json"
              private const val KEY_ERROR = "error"
              private const val KEY_FETCHED = "fetched"

              private fun prefs(ctx: Context) = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              fun link(ctx: Context): String = prefs(ctx).getString(KEY_LINK, "") ?: ""

              fun saveLink(ctx: Context, link: String) {
                  prefs(ctx).edit().putString(KEY_LINK, link.trim()).remove(KEY_JSON).remove(KEY_ERROR).apply()
              }

              /** The tracker's own address: the widget link without "?widget=…". */
              fun appUrl(ctx: Context): String = link(ctx).substringBefore("?")

              fun cached(ctx: Context): JSONObject? =
                  prefs(ctx).getString(KEY_JSON, null)?.let { runCatching { JSONObject(it) }.getOrNull() }

              fun lastError(ctx: Context): String? = prefs(ctx).getString(KEY_ERROR, null)

              fun fetchedAt(ctx: Context): Long = prefs(ctx).getLong(KEY_FETCHED, 0L)

              private const val KEY_SEED = "seed"

              /** Which suggestion to show; "Another" moves it on. */
              fun seed(ctx: Context): Int = prefs(ctx).getInt(KEY_SEED, 0)
              fun nextSeed(ctx: Context) { prefs(ctx).edit().putInt(KEY_SEED, seed(ctx) + 1).apply() }

              /** Downloads the latest numbers. Returns null on success or an error message. Call off the main thread. */
              fun refresh(ctx: Context): String? {
                  val link = link(ctx)
                  if (link.isBlank()) return "No link saved yet"
                  return try {
                      val body = httpGet("$link&s=${seed(ctx)}")
                      val json = try {
                          JSONObject(body)
                      } catch (e: Exception) {
                          throw IllegalStateException(
                              if (body.contains("accounts.google.com") || body.contains("<html", true))
                                  "The link opened a Google page instead of your numbers. Redeploy the web app with access set to Anyone."
                              else "The link didn’t return Thali data. Copy it again from the Me tab."
                          )
                      }
                      if (json.has("error")) throw IllegalStateException("Link not valid: make a new one on the Me tab.")
                      prefs(ctx).edit()
                          .putString(KEY_JSON, json.toString())
                          .putLong(KEY_FETCHED, System.currentTimeMillis())
                          .remove(KEY_ERROR)
                          .apply()
                      null
                  } catch (e: Exception) {
                      val msg = e.message ?: "Couldn’t reach Thali. Check your internet."
                      prefs(ctx).edit().putString(KEY_ERROR, msg).apply()
                      msg
                  }
              }

              /** Adds water for today through the widget link, then saves the new numbers. Call off the main thread. */
              fun addWater(ctx: Context, ml: Int): String? {
                  val link = link(ctx)
                  if (link.isBlank()) return "No link saved yet"
                  return try {
                      val json = JSONObject(httpGet("$link&addWater=$ml&s=${seed(ctx)}"))
                      if (json.has("error")) throw IllegalStateException(json.optString("error"))
                      prefs(ctx).edit().putString(KEY_JSON, json.toString())
                          .putLong(KEY_FETCHED, System.currentTimeMillis()).remove(KEY_ERROR).apply()
                      null
                  } catch (e: Exception) {
                      val msg = e.message ?: "Couldn’t add water. Check your internet."
                      prefs(ctx).edit().putString(KEY_ERROR, msg).apply()
                      msg
                  }
              }

              /** Shows added water on the widget straight away, before the server confirms it. */
              fun bumpWater(ctx: Context, ml: Int) {
                  val d = cached(ctx) ?: return
                  val water = d.optInt("water") + ml
                  val goal = d.optInt("waterGoal", 2500).coerceAtLeast(1)
                  d.put("water", water)
                  d.put("waterPercent", water * 100 / goal)
                  prefs(ctx).edit().putString(KEY_JSON, d.toString()).apply()
              }

              private fun httpGet(start: String): String {
                  var url = start
                  repeat(6) {
                      val conn = (URL(url).openConnection() as HttpURLConnection).apply {
                          instanceFollowRedirects = false
                          connectTimeout = 20000
                          readTimeout = 20000
                          setRequestProperty("User-Agent", "ThaliWidget/1.0 (Android)")
                      }
                      try {
                          val code = conn.responseCode
                          if (code in 300..399) {
                              val next = conn.getHeaderField("Location") ?: throw IllegalStateException("Redirect without a target")
                              url = URL(URL(url), next).toString()
                              return@repeat
                          }
                          if (code !in 200..299) throw IllegalStateException("Server answered $code. Check the link.")
                          return conn.inputStream.bufferedReader().use { it.readText() }
                      } finally {
                          conn.disconnect()
                      }
                  }
                  throw IllegalStateException("Too many redirects")
              }

              private val nf: NumberFormat = NumberFormat.getIntegerInstance(Locale("en", "IN"))
              fun fmt(n: Int): String = nf.format(n)

              /** 34.0 -> "34", 34.5 -> "34.5" */
              fun fmt1(n: Double): String = if (n % 1.0 == 0.0) nf.format(n.toLong()) else String.format(Locale.US, "%.1f", n)

              /** 1500 -> "1.5 L", 750 -> "0.75 L" */
              fun litres(ml: Int): String {
                  val l = ml / 1000.0
                  return (if (ml % 100 == 0) String.format(Locale.US, "%.1f", l) else String.format(Locale.US, "%.2f", l)) + " L"
              }
          }
          THALI_EOF

          mkdir -p app/src/main/java/com/thali/widget
          cat > app/src/main/java/com/thali/widget/ThaliSuggestWidget.kt <<'THALI_EOF'
          package com.thali.widget

          /** The taller widget: the same three rings plus a meal suggestion. */
          class ThaliSuggestWidget : ThaliWidget() {
              override val suggest: Boolean get() = true
          }
          THALI_EOF

          mkdir -p app/src/main/java/com/thali/widget
          cat > app/src/main/java/com/thali/widget/ThaliWidget.kt <<'THALI_EOF'
          package com.thali.widget

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.text.format.DateFormat
          import android.view.View
          import android.widget.RemoteViews
          import java.util.Date

          open class ThaliWidget : AppWidgetProvider() {

              /** true for the taller widget that also shows a meal suggestion */
              open val suggest: Boolean get() = false

              override fun onUpdate(ctx: Context, mgr: AppWidgetManager, ids: IntArray) {
                  ids.forEach { mgr.updateAppWidget(it, build(ctx, layoutFor(mgr, it, suggest))) }
                  RefreshWorker.schedule(ctx)
                  RefreshWorker.runNow(ctx)
              }

              /** Redraw with the right layout when the widget is resized. */
              override fun onAppWidgetOptionsChanged(ctx: Context, mgr: AppWidgetManager, id: Int, newOptions: Bundle) {
                  mgr.updateAppWidget(id, build(ctx, layoutFor(mgr, id, suggest)))
              }

              override fun onEnabled(ctx: Context) {
                  RefreshWorker.schedule(ctx)
                  RefreshWorker.runNow(ctx)
              }

              override fun onDisabled(ctx: Context) {
                  RefreshWorker.cancel(ctx)
              }

              override fun onReceive(ctx: Context, intent: Intent) {
                  super.onReceive(ctx, intent)
                  when (intent.action) {
                      ACTION_REFRESH -> {
                          updateAll(ctx, updating = true)
                          RefreshWorker.runNow(ctx)
                      }
                      ACTION_SHUFFLE -> {
                          ThaliData.nextSeed(ctx)
                          updateAll(ctx, updating = true)
                          RefreshWorker.runNow(ctx)
                      }
                      ACTION_WATER -> {
                          if (ThaliData.link(ctx).isBlank()) return
                          ThaliData.bumpWater(ctx, GLASS_ML)
                          updateAll(ctx, updating = true)
                          RefreshWorker.addWater(ctx, GLASS_ML)
                      }
                  }
              }

              companion object {
                  const val ACTION_REFRESH = "com.thali.widget.REFRESH"
                  const val ACTION_WATER = "com.thali.widget.ADD_WATER"
                  const val ACTION_SHUFFLE = "com.thali.widget.SHUFFLE"
                  const val GLASS_ML = 250

                  fun updateAll(ctx: Context, updating: Boolean = false) {
                      val mgr = AppWidgetManager.getInstance(ctx)
                      mgr.getAppWidgetIds(ComponentName(ctx, ThaliWidget::class.java))
                          .forEach { mgr.updateAppWidget(it, build(ctx, layoutFor(mgr, it, false), updating)) }
                      mgr.getAppWidgetIds(ComponentName(ctx, ThaliSuggestWidget::class.java))
                          .forEach { mgr.updateAppWidget(it, build(ctx, layoutFor(mgr, it, true), updating)) }
                  }

                  /**
                   * Picks the large layout (big rings, bigger text) when the widget is tall enough,
                   * otherwise the compact one. Portrait height is reported as MAX_HEIGHT.
                   */
                  fun layoutFor(mgr: AppWidgetManager, id: Int, suggest: Boolean): Int {
                      val opts = mgr.getAppWidgetOptions(id)
                      val h = opts.getInt(AppWidgetManager.OPTION_APPWIDGET_MAX_HEIGHT, 0)
                      val w = opts.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 0)
                      val narrow = w in 1..299
                      return if (suggest) {
                          if (!narrow && (h == 0 || h >= 280)) R.layout.widget_suggest else R.layout.widget_suggest_compact
                      } else {
                          if (!narrow && (h == 0 || h >= 175)) R.layout.widget else R.layout.widget_compact
                      }
                  }

                  private fun build(ctx: Context, layoutId: Int, updating: Boolean = false): RemoteViews {
                      val v = RemoteViews(ctx.packageName, layoutId)
                      val withSuggestion = layoutId == R.layout.widget_suggest || layoutId == R.layout.widget_suggest_compact
                      val flags = PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE

                      // Buttons
                      val refresh = Intent(ctx, ThaliWidget::class.java).setAction(ACTION_REFRESH)
                      v.setOnClickPendingIntent(R.id.refresh, PendingIntent.getBroadcast(ctx, 1, refresh, flags))
                      val water = Intent(ctx, ThaliWidget::class.java).setAction(ACTION_WATER)
                      v.setOnClickPendingIntent(R.id.add_water, PendingIntent.getBroadcast(ctx, 3, water, flags))

                      // Tapping the widget or "+ Food" opens the tracker (or this app if no link yet)
                      val appUrl = ThaliData.appUrl(ctx)
                      val open = if (appUrl.startsWith("http")) Intent(Intent.ACTION_VIEW, Uri.parse(appUrl))
                                 else Intent(ctx, MainActivity::class.java)
                      open.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      val openPi = PendingIntent.getActivity(ctx, 2, open, flags)
                      v.setOnClickPendingIntent(R.id.root, openPi)
                      v.setOnClickPendingIntent(R.id.add_food, openPi)
                      if (withSuggestion) {
                          v.setOnClickPendingIntent(R.id.sugg_box, openPi)
                          val shuffle = Intent(ctx, ThaliWidget::class.java).setAction(ACTION_SHUFFLE)
                          v.setOnClickPendingIntent(R.id.sugg_next, PendingIntent.getBroadcast(ctx, 4, shuffle, flags))
                      }

                      val data = ThaliData.cached(ctx)
                      if (data == null) {
                          listOf(R.id.kcal_val, R.id.prot_val, R.id.water_val).forEach { v.setTextViewText(it, "–") }
                          listOf(R.id.kcal_sub, R.id.prot_sub, R.id.water_sub).forEach { v.setTextViewText(it, "") }
                          listOf(R.id.kcal_ring, R.id.prot_ring, R.id.water_ring).forEach { v.setProgressBar(it, 100, 0, false) }
                          v.setViewVisibility(R.id.kcal_ring_over, View.GONE)
                          v.setTextViewText(R.id.updated, when {
                              updating -> ctx.getString(R.string.updating)
                              ThaliData.link(ctx).isBlank() -> ctx.getString(R.string.widget_setup)
                              else -> ThaliData.lastError(ctx) ?: ctx.getString(R.string.widget_loading)
                          })
                          if (withSuggestion) v.setViewVisibility(R.id.sugg_box, View.GONE)
                          return v
                      }

                      // Calories
                      val total = data.optInt("total")
                      val goal = data.optInt("goal", 2000).coerceAtLeast(1)
                      val left = goal - total
                      val over = left < 0
                      v.setTextViewText(R.id.kcal_val, ThaliData.fmt(total))
                      v.setTextViewText(R.id.kcal_sub, if (over) "+${ThaliData.fmt(-left)} over" else "of " + ThaliData.fmt(goal))
                      v.setTextColor(R.id.kcal_sub, ctx.getColor(if (over) R.color.chilli else R.color.muted))
                      v.setProgressBar(R.id.kcal_ring, 100, (total * 100 / goal).coerceIn(0, 100), false)
                      v.setViewVisibility(R.id.kcal_ring_over, if (over) View.VISIBLE else View.GONE)
                      v.setTextColor(R.id.kcal_val, ctx.getColor(if (over) R.color.chilli else R.color.ink))

                      // Protein
                      val protein = data.optDouble("protein", 0.0)
                      val pGoal = data.optInt("proteinGoal", 60).coerceAtLeast(1)
                      v.setTextViewText(R.id.prot_val, ThaliData.fmt1(protein) + " g")
                      v.setTextViewText(R.id.prot_sub, "of $pGoal g")
                      v.setProgressBar(R.id.prot_ring, 100, (protein * 100 / pGoal).toInt().coerceIn(0, 100), false)
                      v.setTextColor(R.id.prot_val, ctx.getColor(R.color.protein))
                      v.setTextViewText(R.id.prot_label, if (protein >= pGoal) "Protein ✓" else "Protein")

                      // Water
                      val waterMl = data.optInt("water")
                      val wGoal = data.optInt("waterGoal", 2500).coerceAtLeast(1)
                      v.setTextViewText(R.id.water_val, ThaliData.litres(waterMl))
                      v.setTextViewText(R.id.water_sub, "of " + ThaliData.litres(wGoal))
                      v.setProgressBar(R.id.water_ring, 100, (waterMl * 100 / wGoal).coerceIn(0, 100), false)
                      v.setTextColor(R.id.water_val, ctx.getColor(R.color.water))
                      v.setTextViewText(R.id.water_label, if (waterMl >= wGoal) "Water ✓" else "Water")


                      // Suggestion (taller widget only)
                      if (withSuggestion) {
                          val sg = data.optJSONObject("suggestion")
                          val food = sg?.optString("food").orEmpty()
                          if (sg == null || food.isBlank()) {
                              v.setViewVisibility(R.id.sugg_box, View.GONE)
                          } else {
                              v.setViewVisibility(R.id.sugg_box, View.VISIBLE)
                              v.setTextViewText(R.id.sugg_msg, sg.optString("short").ifBlank { sg.optString("message") })
                              v.setTextViewText(R.id.sugg_food, food)
                              val sp = sg.optDouble("protein", 0.0)
                              v.setTextViewText(R.id.sugg_meta, "${sg.optString("serving")}, ${ThaliData.fmt(sg.optInt("calories"))} kcal, ${ThaliData.fmt1(sp)} g protein")
                          }
                      }

                      val err = ThaliData.lastError(ctx)
                      val time = DateFormat.getTimeFormat(ctx).format(Date(ThaliData.fetchedAt(ctx)))
                      v.setTextViewText(R.id.updated, when {
                          updating -> ctx.getString(R.string.updating)
                          err != null -> "Offline $time"
                          else -> time
                      })
                      return v
                  }
              }
          }
          THALI_EOF

          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/btn_bg.xml <<'THALI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="@color/leaf" />
              <corners android:radius="14dp" />
          </shape>
          THALI_EOF

          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/btn_soft.xml <<'THALI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="@color/track" />
              <corners android:radius="14dp" />
          </shape>
          THALI_EOF

          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_foreground.xml <<'THALI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
