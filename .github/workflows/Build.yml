          package com.thali.widget

          import android.Manifest
          import android.app.Activity
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.view.View
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.Spinner
          import android.widget.Switch
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import kotlin.concurrent.thread

          /** One screen: paste your widget link, test it, save it. */
          class MainActivity : Activity() {

              private lateinit var input: EditText
              private lateinit var result: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  input = findViewById(R.id.link_input)
                  result = findViewById(R.id.result)
                  input.setText(ThaliData.link(this))

                  findViewById<Button>(R.id.paste).setOnClickListener {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val text = cm.primaryClip?.takeIf { it.itemCount > 0 }?.getItemAt(0)?.coerceToText(this)?.toString()
                      if (text.isNullOrBlank()) result.text = getString(R.string.clipboard_empty) else input.setText(text.trim())
                  }

                  findViewById<Button>(R.id.save).setOnClickListener { saveAndTest() }

                  findViewById<Button>(R.id.open_app).setOnClickListener {
                      if (ThaliData.appUrl(this).startsWith("http")) {
                          startActivity(Intent(this, AppActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP))
                          finish()
                      } else result.text = getString(R.string.need_link)
                  }
                  showCached()
                  setupReminders()
              }

              private fun setupReminders() {
                  Notif.channels(this)
                  val swWater = findViewById<Switch>(R.id.sw_water)
                  val swBehind = findViewById<Switch>(R.id.sw_behind)
                  val swMeals = findViewById<Switch>(R.id.sw_meals)
                  val swProtein = findViewById<Switch>(R.id.sw_protein)
                  val status = findViewById<TextView>(R.id.notif_status)

                  swWater.isChecked = Reminders.waterOn(this)
                  swBehind.isChecked = Reminders.onlyBehind(this)
                  swMeals.isChecked = Reminders.mealsOn(this)
                  swProtein.isChecked = Reminders.proteinOn(this)

                  fun changed(turnedOn: Boolean) {
                      if (turnedOn) askNotificationPermission()
                      Reminders.schedule(this)
                  }
                  swWater.setOnCheckedChangeListener { _, on -> Reminders.put(this, "water_on", on); changed(on) }
                  swBehind.setOnCheckedChangeListener { _, on -> Reminders.put(this, "only_behind", on) }
                  swMeals.setOnCheckedChangeListener { _, on -> Reminders.put(this, "meals_on", on); changed(on) }
                  swProtein.setOnCheckedChangeListener { _, on -> Reminders.put(this, "protein_on", on); changed(on) }

                  bindSpinner(R.id.sp_every, listOf(60 to "1 hour", 90 to "1.5 hours", 120 to "2 hours", 180 to "3 hours"),
                      Reminders.everyMin(this)) { Reminders.put(this, "water_every", it) }
                  bindSpinner(R.id.sp_start, (5..12).map { it to hourLabel(it) }, Reminders.startHour(this)) { Reminders.put(this, "start_hour", it) }
                  bindSpinner(R.id.sp_end, (17..24).map { it to hourLabel(it) }, Reminders.endHour(this)) { Reminders.put(this, "end_hour", it) }

                  findViewById<Button>(R.id.test_notif).setOnClickListener {
                      askNotificationPermission()
                      Reminders.schedule(this)
                      status.text = getString(if (Notif.test(this)) R.string.notif_sent else R.string.notif_blocked)
                  }
                  if (!Notif.canPost(this)) status.text = getString(R.string.notif_blocked)
              }

              private fun hourLabel(h: Int) = when {
                  h == 24 -> "midnight"
                  h == 12 -> "12 pm"
                  h > 12 -> "${h - 12} pm"
                  else -> "$h am"
              }

              private fun bindSpinner(id: Int, options: List<Pair<Int, String>>, current: Int, onPick: (Int) -> Unit) {
                  val sp = findViewById<Spinner>(id)
                  sp.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, options.map { it.second })
                  sp.setSelection(options.indexOfFirst { it.first == current }.coerceAtLeast(0))
                  sp.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, rowId: Long) = onPick(options[position].first)
                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }
              }

              private fun askNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 8)
                  }
              }

              private fun saveAndTest() {
                  val link = input.text.toString().trim()
                  if (!link.startsWith("https://script.google.com/") || !link.contains("/exec")) {
                      result.text = getString(R.string.bad_link)
                      return
                  }
                  ThaliData.saveLink(this, link)
                  result.text = getString(R.string.testing)
                  thread {
                      val err = if (link.contains("widget=")) ThaliData.refresh(this) else null
                      ThaliWidget.updateAll(this)
                      RefreshWorker.schedule(this)
                      runOnUiThread {
                          when {
                              err != null -> result.text = "Didn’t work: $err"
                              !link.contains("widget=") -> result.text = "Saved. Tap Open NutriLog. (For the widgets, use the widget link from the Me tab.)"
                              else -> showCached(prefix = "Saved. ")
                          }
                      }
                  }
              }

              private fun showCached(prefix: String = "") {
                  val d = ThaliData.cached(this) ?: return
                  result.text = prefix + "Hi ${d.optString("name")}! Today: ${ThaliData.fmt(d.optInt("total"))} of " +
                      "${ThaliData.fmt(d.optInt("goal"))} kcal, water ${ThaliData.fmt(d.optInt("water"))} ml.\n\n" +
                      getString(R.string.add_widget_hint)
              }
          }
          THALI_EOF

          mkdir -p app/src/main/java/com/thali/widget
          cat > app/src/main/java/com/thali/widget/MoreWidgets.kt <<'THALI_EOF'
          package com.thali.widget

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.text.format.DateFormat
          import android.widget.RemoteViews
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.max
          import kotlin.math.min

          /** Base for the extra widgets. Each one only says which kind it is. */
          abstract class ExtraWidget : AppWidgetProvider() {
              abstract val kind: Int

              override fun onUpdate(ctx: Context, mgr: AppWidgetManager, ids: IntArray) {
                  ids.forEach { mgr.updateAppWidget(it, MoreWidgets.build(ctx, kind, mgr, it)) }
                  RefreshWorker.schedule(ctx)
                  RefreshWorker.runNow(ctx)
              }

              override fun onAppWidgetOptionsChanged(ctx: Context, mgr: AppWidgetManager, id: Int, newOptions: Bundle) {
                  mgr.updateAppWidget(id, MoreWidgets.build(ctx, kind, mgr, id))
              }
          }

          class CaloriesWidget : ExtraWidget() { override val kind = MoreWidgets.CALORIES }
          class ProteinWidget : ExtraWidget() { override val kind = MoreWidgets.PROTEIN }
          class WaterWidget : ExtraWidget() { override val kind = MoreWidgets.WATER }
          class MealsWidget : ExtraWidget() { override val kind = MoreWidgets.MEALS }
          class WeekWidget : ExtraWidget() { override val kind = MoreWidgets.WEEK }
          class NextMealWidget : ExtraWidget() { override val kind = MoreWidgets.NEXT }

          /** Steps counted by the phone's own sensor. Works even before you sign in. */
          class StepsWidget : ExtraWidget() {
              override val kind: Int = MoreWidgets.STEPS
              override fun onEnabled(ctx: Context) { Steps.start(ctx) }
              override fun onUpdate(ctx: Context, mgr: AppWidgetManager, ids: IntArray) {
                  super.onUpdate(ctx, mgr, ids)
                  Steps.start(ctx)
              }
          }

          object MoreWidgets {
              const val CALORIES = 1
              const val PROTEIN = 2
              const val WATER = 3
              const val MEALS = 4
              const val WEEK = 5
              const val NEXT = 6
              const val STEPS = 7

              private val providers = listOf(
                  CALORIES to CaloriesWidget::class.java, PROTEIN to ProteinWidget::class.java, WATER to WaterWidget::class.java,
                  MEALS to MealsWidget::class.java, WEEK to WeekWidget::class.java, NEXT to NextMealWidget::class.java,
                  STEPS to StepsWidget::class.java)

              private val MEALS_LIST = listOf("Breakfast" to "breakfast", "Lunch" to "lunch", "Snacks" to "snacks", "Dinner" to "dinner")
              private val MEAL_COLORS = listOf(R.color.turmeric, R.color.leaf, R.color.saffron, R.color.brinjal)
              private val MEAL_SHARE = listOf(0.25f, 0.35f, 0.10f, 0.30f)
              private val FLAGS = PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE

              fun updateAll(ctx: Context, updating: Boolean = false) {
                  val mgr = AppWidgetManager.getInstance(ctx)
                  for ((kind, cls) in providers) {
                      mgr.getAppWidgetIds(ComponentName(ctx, cls)).forEach { mgr.updateAppWidget(it, build(ctx, kind, mgr, it, updating)) }
                  }
              }

              fun build(ctx: Context, kind: Int, mgr: AppWidgetManager, id: Int, updating: Boolean = false): RemoteViews {
                  val opts = mgr.getAppWidgetOptions(id)
                  val wDp = opts.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 0).takeIf { it > 0 } ?: 300
                  val hDp = opts.getInt(AppWidgetManager.OPTION_APPWIDGET_MAX_HEIGHT, 0).takeIf { it > 0 } ?: 170
                  val layout = when (kind) {
                      CALORIES -> R.layout.widget_calories; PROTEIN -> R.layout.widget_protein; WATER -> R.layout.widget_water
                      MEALS -> R.layout.widget_meals; WEEK -> R.layout.widget_week; STEPS -> R.layout.widget_steps; else -> R.layout.widget_next
                  }
                  val v = RemoteViews(ctx.packageName, layout)
                  val data = ThaliData.cached(ctx)
                  common(ctx, v, data, updating, short = kind == NEXT)
                  when (kind) {
                      CALORIES -> calories(ctx, v, data, wDp, hDp)
                      PROTEIN -> protein(ctx, v, data, wDp, hDp)
                      WATER -> water(ctx, v, data, hDp)
                      MEALS -> meals(ctx, v, data)
                      WEEK -> week(ctx, v, data, wDp, hDp)
                      STEPS -> steps(ctx, v, data, wDp, hDp)
                      else -> next(ctx, v, data)
                  }
                  return v
              }

              private fun color(ctx: Context, res: Int) = ctx.getColor(res)

              private fun broadcast(ctx: Context, action: String, code: Int, ml: Int = 0): PendingIntent {
                  val i = Intent(ctx, ThaliWidget::class.java).setAction(action)
                  if (ml > 0) i.putExtra(ThaliWidget.EXTRA_ML, ml)
                  return PendingIntent.getBroadcast(ctx, code, i, FLAGS)
              }

              /** Header text, refresh button and "tap to open NutriLog" for every extra widget. */
              private fun common(ctx: Context, v: RemoteViews, data: JSONObject?, updating: Boolean, short: Boolean) {
                  val open = PendingIntent.getActivity(ctx, 2, Intent(ctx, AppActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK), FLAGS)
                  v.setOnClickPendingIntent(R.id.root, open)
                  v.setOnClickPendingIntent(R.id.refresh, broadcast(ctx, ThaliWidget.ACTION_REFRESH, 1))
                  val err = ThaliData.lastError(ctx)
                  val time = DateFormat.getTimeFormat(ctx).format(Date(ThaliData.fetchedAt(ctx)))
                  v.setTextViewText(R.id.updated, when {
                      updating -> ctx.getString(R.string.updating)
                      ThaliData.link(ctx).isBlank() -> ctx.getString(R.string.widget_setup)
                      data == null -> err ?: ctx.getString(R.string.widget_loading)
                      err != null -> if (short) "Offline" else "Offline, last updated $time"
                      else -> if (short) time else "Updated $time"
                  })
              }

              private fun dpBox(wDp: Int, hDp: Int, wShare: Float, headerDp: Int) =
                  min((wDp * wShare).toInt(), hDp - headerDp).coerceIn(60, 160)

              private fun calories(ctx: Context, v: RemoteViews, d: JSONObject?, wDp: Int, hDp: Int) {
                  val total = d?.optInt("total") ?: 0
                  val goal = (d?.optInt("goal", 2000) ?: 2000).coerceAtLeast(1)
                  val left = goal - total
                  val scaleTo = max(goal, total).toFloat()
                  val parts = MEALS_LIST.mapIndexed { i, (_, key) -> ((d?.optInt(key) ?: 0) / scaleTo) to color(ctx, MEAL_COLORS[i]) }
                  val size = dpBox(wDp, hDp, 0.45f, 52)
                  v.setImageViewBitmap(R.id.chart, Charts.donut(ctx, size, parts, color(ctx, R.color.track),
                      ThaliData.fmt(total), "of ${ThaliData.fmt(goal)} kcal",
                      color(ctx, if (left < 0) R.color.chilli else R.color.ink), color(ctx, R.color.muted),
                      if (left < 0) goal / scaleTo else null, color(ctx, R.color.chilli)))
                  v.setTextViewText(R.id.status, if (d == null) "–" else if (left >= 0) "${ThaliData.fmt(left)} kcal left" else "${ThaliData.fmt(-left)} kcal over")
                  v.setTextColor(R.id.status, color(ctx, if (left < 0) R.color.chilli else R.color.leaf))
                  val ids = listOf(R.id.meal1, R.id.meal2, R.id.meal3, R.id.meal4)
                  MEALS_LIST.forEachIndexed { i, (label, key) ->
                      v.setTextViewText(ids[i], "●  $label  ${ThaliData.fmt(d?.optInt(key) ?: 0)}")
                      v.setTextColor(ids[i], color(ctx, MEAL_COLORS[i]))
                  }
              }

              private fun protein(ctx: Context, v: RemoteViews, d: JSONObject?, wDp: Int, hDp: Int) {
                  val p = d?.optDouble("protein", 0.0) ?: 0.0
                  val goal = (d?.optInt("proteinGoal", 60) ?: 60).coerceAtLeast(1)
                  val gw = (wDp * 0.5f).toInt().coerceIn(110, 220)
                  val gh = (hDp - 52).coerceIn(60, 130)
                  v.setImageViewBitmap(R.id.chart, Charts.gauge(ctx, gw, gh, (p / goal).toFloat(), color(ctx, R.color.protein),
                      color(ctx, R.color.protein_soft), "${ThaliData.fmt1(p)} g", "of $goal g", color(ctx, R.color.protein), color(ctx, R.color.muted)))
                  val gap = goal - p
                  v.setTextViewText(R.id.big, if (d == null) "–" else if (gap <= 0) "Goal reached ✓" else "${ThaliData.fmt1(gap)} g to go")
                  v.setTextViewText(R.id.sub, "${(p * 100 / goal).toInt()}% of today’s goal")
                  val sg = d?.optJSONObject("suggestion")
                  val food = sg?.optString("food").orEmpty()
                  v.setTextViewText(R.id.sugg, when {
                      sg != null && food.isNotBlank() && sg.optString("mode") == "protein" -> "Try $food (${ThaliData.fmt1(sg.optDouble("protein", 0.0))} g)"
                      gap > 0 -> "Paneer, eggs, dal, sprouts or curd help close the gap."
                      else -> "Nicely done today."
                  })
              }

              private fun water(ctx: Context, v: RemoteViews, d: JSONObject?, hDp: Int) {
                  val ml = d?.optInt("water") ?: 0
                  val goal = (d?.optInt("waterGoal", 2500) ?: 2500).coerceAtLeast(1)
                  v.setImageViewBitmap(R.id.chart, Charts.bottle(ctx, 64, (hDp - 50).coerceIn(70, 150), ml.toFloat() / goal,
                      color(ctx, R.color.water), color(ctx, R.color.water_soft), color(ctx, R.color.muted)))
                  v.setTextViewText(R.id.big, if (d == null) "–" else ThaliData.litres(ml))
                  val glasses = ml / 250
                  v.setTextViewText(R.id.sub, if (ml >= goal) "Goal of ${ThaliData.litres(goal)} reached ✓"
                      else "of ${ThaliData.litres(goal)}, $glasses glass${if (glasses == 1) "" else "es"} so far")
                  v.setOnClickPendingIntent(R.id.add_250, broadcast(ctx, ThaliWidget.ACTION_WATER, 31, 250))
                  v.setOnClickPendingIntent(R.id.add_500, broadcast(ctx, ThaliWidget.ACTION_WATER, 32, 500))
                  v.setOnClickPendingIntent(R.id.add_1000, broadcast(ctx, ThaliWidget.ACTION_WATER, 33, 1000))
              }

              private fun meals(ctx: Context, v: RemoteViews, d: JSONObject?) {
                  val goal = (d?.optInt("goal", 2000) ?: 2000).coerceAtLeast(1)
                  val rings = listOf(R.id.m1_ring, R.id.m2_ring, R.id.m3_ring, R.id.m4_ring)
                  val labels = listOf(R.id.m1_label, R.id.m2_label, R.id.m3_label, R.id.m4_label)
                  val kcals = listOf(R.id.m1_kcal, R.id.m2_kcal, R.id.m3_kcal, R.id.m4_kcal)
                  val prots = listOf(R.id.m1_prot, R.id.m2_prot, R.id.m3_prot, R.id.m4_prot)
                  MEALS_LIST.forEachIndexed { i, (label, key) ->
                      val k = d?.optInt(key) ?: 0
                      val share = goal * MEAL_SHARE[i]
                      v.setImageViewBitmap(rings[i], Charts.ring(ctx, 44, k / share, color(ctx, MEAL_COLORS[i]), color(ctx, R.color.track)))
                      v.setTextViewText(labels[i], label)
                      v.setTextViewText(kcals[i], ThaliData.fmt(k))
                      v.setTextViewText(prots[i], "${ThaliData.fmt1(d?.optDouble("${key}Protein", 0.0) ?: 0.0)} g")
                  }
              }

              private fun week(ctx: Context, v: RemoteViews, d: JSONObject?, wDp: Int, hDp: Int) {
                  val arr = d?.optJSONArray("week")
                  val goal = (d?.optInt("goal", 2000) ?: 2000).coerceAtLeast(1)
                  val values = ArrayList<Int>(); val labels = ArrayList<String>()
                  val inFmt = SimpleDateFormat("yyyy-MM-dd", Locale.US); val dayFmt = SimpleDateFormat("EEEEE", Locale.getDefault())
                  if (arr != null) for (i in 0 until arr.length()) {
                      val o = arr.optJSONObject(i) ?: continue
                      values.add(o.optInt("total"))
                      labels.add(runCatching { dayFmt.format(inFmt.parse(o.optString("date"))!!) }.getOrDefault(""))
                  }
                  if (values.isEmpty()) repeat(7) { values.add(0); labels.add("") }
                  val chartW = (wDp - 30).coerceIn(150, 360)
                  val chartH = (hDp - 80).coerceIn(50, 130)
                  v.setImageViewBitmap(R.id.chart, Charts.bars(ctx, chartW, chartH, values, labels, goal,
                      color(ctx, R.color.leaf), color(ctx, R.color.chilli), color(ctx, R.color.track), color(ctx, R.color.turmeric),
                      color(ctx, R.color.muted), values.size - 1, color(ctx, R.color.ink)))
                  val streak = d?.optInt("streak") ?: 0
                  v.setTextViewText(R.id.streak, if (streak > 0) "🔥 $streak day${if (streak == 1) "" else "s"}" else "")
                  val logged = values.filter { it > 0 }
                  val avg = if (logged.isEmpty()) 0 else logged.sum() / logged.size
                  val onTarget = logged.count { it <= goal }
                  v.setTextViewText(R.id.foot, if (logged.isEmpty()) "Nothing logged this week yet"
                      else "Average ${ThaliData.fmt(avg)} kcal, $onTarget of ${logged.size} logged days on target")
              }

              private fun steps(ctx: Context, v: RemoteViews, d: JSONObject?, wDp: Int, hDp: Int) {
                  val status = Steps.status(ctx)
                  val todayKey = Steps.today()
                  val sameDay = d != null && d.optString("date") == todayKey
                  val server = if (sameDay) d?.optJSONObject("activity") else null
                  d?.optInt("stepGoal", 0)?.let { if (it > 0) Steps.setGoal(ctx, it) }
                  val goal = Steps.goal(ctx).coerceAtLeast(1)
                  // what the phone counted, or more if your watch / Health Connect reported more
                  val steps = max(Steps.forDate(ctx, todayKey), server?.optLong("steps", 0L) ?: 0L)
                  val frac = steps.toFloat() / goal
                  val done = steps >= goal
                  val showBars = hDp >= 170
                  val size = dpBox(wDp, if (showBars) hDp - 70 else hDp, 0.4f, 52)
                  val actColor = color(ctx, if (done) R.color.leaf else R.color.act)
                  v.setImageViewBitmap(R.id.chart, Charts.donut(ctx, size, listOf(min(frac, 1f) to actColor), color(ctx, R.color.track),
                      ThaliData.fmt(steps.toInt()), "of ${ThaliData.fmt(goal)}", color(ctx, R.color.ink), color(ctx, R.color.muted), null, color(ctx, R.color.chilli)))

                  when (status) {
                      "no_sensor" -> {
                          v.setTextViewText(R.id.big, "No step sensor")
                          v.setTextViewText(R.id.sub, "This phone can’t count steps itself")
                          v.setTextViewText(R.id.stats, "")
                      }
                      "no_permission" -> {
                          v.setTextViewText(R.id.big, "Allow step counting")
                          v.setTextViewText(R.id.sub, "Tap here, then tap Allow")
                          v.setTextViewText(R.id.stats, "")
                          val ask = Intent(ctx, AppActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              .putExtra(AppActivity.EXTRA_ENABLE_STEPS, true)
                          v.setOnClickPendingIntent(R.id.root, PendingIntent.getActivity(ctx, 3, ask, FLAGS))
                      }
                      else -> {
                          v.setTextViewText(R.id.big, if (done) "Goal reached ✓" else "${ThaliData.fmt((goal - steps).toInt())} to go")
                          v.setTextViewText(R.id.sub, "${(steps * 100 / goal).toInt()}% of today’s goal")
                          val dist = max(server?.optLong("distanceM", 0L) ?: 0L, Steps.distanceM(steps))
                          val kcal = max(server?.optLong("activeKcal", 0L) ?: 0L, Steps.kcal(steps))
                          v.setTextViewText(R.id.stats, String.format(Locale.US, "%.1f km  ·  %s kcal", dist / 1000.0, ThaliData.fmt(kcal.toInt())))
                      }
                  }
                  val last = Steps.lastSample(ctx)
                  v.setTextViewText(R.id.updated, if (last > 0L) "Counted by your phone, " + DateFormat.getTimeFormat(ctx).format(Date(last)) else "Counted by your phone")

                  // last seven days (taller widget): what the phone counted, or more if the server has a higher number
                  v.setViewVisibility(R.id.bars, if (showBars) android.view.View.VISIBLE else android.view.View.GONE)
                  if (showBars) {
                      val fromServer = HashMap<String, Long>()
                      d?.optJSONArray("week")?.let { arr ->
                          for (i in 0 until arr.length()) arr.optJSONObject(i)?.let { fromServer[it.optString("date")] = it.optLong("steps", 0L) }
                      }
                      val today = java.time.LocalDate.now()
                      val days = (6 downTo 0).map { today.minusDays(it.toLong()) }
                      val values = days.map { max(Steps.forDate(ctx, it.toString()), fromServer[it.toString()] ?: 0L).toInt() }
                      val labels = days.map { it.dayOfWeek.getDisplayName(java.time.format.TextStyle.NARROW, Locale.getDefault()) }
                      val chartW = (wDp - 30).coerceIn(150, 360)
                      v.setImageViewBitmap(R.id.bars, Charts.bars(ctx, chartW, 56, values, labels, goal,
                          color(ctx, R.color.act), color(ctx, R.color.leaf), color(ctx, R.color.track), color(ctx, R.color.turmeric),
                          color(ctx, R.color.muted), values.size - 1, color(ctx, R.color.ink)))
                  }
              }

              private fun next(ctx: Context, v: RemoteViews, d: JSONObject?) {
                  val sg = d?.optJSONObject("suggestion")
                  val food = sg?.optString("food").orEmpty()
                  if (sg == null || food.isBlank()) {
                      v.setTextViewText(R.id.msg, if (d == null) ctx.getString(R.string.widget_setup) else "No suggestion right now")
                      v.setTextViewText(R.id.food, "")
                      v.setTextViewText(R.id.meta, "")
                  } else {
                      v.setTextViewText(R.id.msg, sg.optString("short").ifBlank { sg.optString("message") })
                      v.setTextViewText(R.id.food, food)
                      v.setTextViewText(R.id.meta, "${sg.optString("serving")}, ${ThaliData.fmt(sg.optInt("calories"))} kcal, ${ThaliData.fmt1(sg.optDouble("protein", 0.0))} g protein")
                  }
                  val open = PendingIntent.getActivity(ctx, 2, Intent(ctx, AppActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK), FLAGS)
                  v.setOnClickPendingIntent(R.id.log_it, open)
                  v.setOnClickPendingIntent(R.id.another, broadcast(ctx, ThaliWidget.ACTION_SHUFFLE, 4))
              }
          }
          THALI_EOF

