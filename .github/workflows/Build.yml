          package com.thali.widget

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import androidx.health.connect.client.HealthConnectClient
          import androidx.health.connect.client.PermissionController
          import androidx.health.connect.client.permission.HealthPermission
          import androidx.health.connect.client.records.ActiveCaloriesBurnedRecord
          import androidx.health.connect.client.records.DistanceRecord
          import androidx.health.connect.client.records.ExerciseSessionRecord
          import androidx.health.connect.client.records.SleepSessionRecord
          import androidx.health.connect.client.records.StepsRecord
          import androidx.health.connect.client.request.AggregateRequest
          import androidx.health.connect.client.request.ReadRecordsRequest
          import androidx.health.connect.client.time.TimeRangeFilter
          import java.time.Duration
          import java.time.Instant
          import java.time.LocalDate
          import java.time.ZoneId
          import java.util.concurrent.atomic.AtomicReference

          /** Reads steps, distance, active calories, sleep and workouts from Health Connect (read only). Steps also come from the phone's own sensor (Steps.kt). */
          object Health {
              const val PROVIDER = "com.google.android.apps.healthdata"
              private const val PREFS = "nutrilog_health"

              private val STEPS = HealthPermission.getReadPermission(StepsRecord::class)
              private val DISTANCE = HealthPermission.getReadPermission(DistanceRecord::class)
              private val ACTIVE = HealthPermission.getReadPermission(ActiveCaloriesBurnedRecord::class)
              private val SLEEP = HealthPermission.getReadPermission(SleepSessionRecord::class)
              private val EXERCISE = HealthPermission.getReadPermission(ExerciseSessionRecord::class)
              val PERMISSIONS = setOf(STEPS, DISTANCE, ACTIVE, SLEEP, EXERCISE)

              /** idle / syncing / done:<time> / error: <message>, read by the web app while it waits */
              val syncState = AtomicReference("idle")

              fun sdkStatus(ctx: Context): Int = HealthConnectClient.getSdkStatus(ctx, PROVIDER)

              fun permissionIntent(ctx: Context): Intent =
                  PermissionController.createRequestPermissionResultContract(PROVIDER).createIntent(ctx, PERMISSIONS)

              fun parseResult(resultCode: Int, data: Intent?): Set<String> =
                  PermissionController.createRequestPermissionResultContract(PROVIDER).parseResult(resultCode, data)

              fun installIntent(): Intent =
                  Intent(Intent.ACTION_VIEW, Uri.parse("https://play.google.com/store/apps/details?id=$PROVIDER&url=healthconnect%3A%2F%2Fonboarding"))
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)

              suspend fun granted(ctx: Context): Set<String> =
                  if (sdkStatus(ctx) != HealthConnectClient.SDK_AVAILABLE) emptySet()
                  else runCatching { HealthConnectClient.getOrCreate(ctx).permissionController.getGrantedPermissions() }.getOrDefault(emptySet())

              /** browser-style status string for the web app */
              suspend fun status(ctx: Context): String = when (sdkStatus(ctx)) {
                  HealthConnectClient.SDK_AVAILABLE -> if (granted(ctx).intersect(PERMISSIONS).isEmpty()) "no_permission" else "connected"
                  HealthConnectClient.SDK_UNAVAILABLE_PROVIDER_UPDATE_REQUIRED -> "needs_install"
                  else -> "unavailable"
              }

              private fun prefs(ctx: Context) = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
              fun lastSync(ctx: Context) = prefs(ctx).getLong("last_sync", 0L)

              data class Day(val steps: Long, val distanceM: Long, val activeKcal: Long, val sleepMin: Long, val exerciseMin: Long, val workouts: Int)

              /** Reads today (and yesterday once a day, so it is complete) and sends them to NutriLog. Returns an error message or null. */
              suspend fun sync(ctx: Context): String? {
                  if (!ThaliData.link(ctx).contains("widget=")) return "Sign in to NutriLog first"
                  Steps.sample(ctx)   // steps counted by the phone's own sensor
                  val hcAvailable = sdkStatus(ctx) == HealthConnectClient.SDK_AVAILABLE
                  val granted = granted(ctx)
                  if (!hcAvailable || granted.intersect(PERMISSIONS).isEmpty()) {
                      // No Health Connect: the phone's own step counter is enough for steps
                      return when (Steps.status(ctx)) {
                          "active" -> Steps.push(ctx, force = true).also { if (it == null) prefs(ctx).edit().putLong("last_sync", System.currentTimeMillis()).apply() }
                          "no_permission" -> "Allow step counting first"
                          else -> if (!hcAvailable) "This phone has no step sensor and Health Connect isn’t available" else "Health Connect isn’t connected yet"
                      }
                  }
                  val client = HealthConnectClient.getOrCreate(ctx)
                  val zone = ZoneId.systemDefault()
                  val today = LocalDate.now(zone)
                  val days = mutableListOf(today)
                  val yKey = "yesterday_done_" + today
                  if (!prefs(ctx).getBoolean(yKey, false)) days.add(today.minusDays(1))
                  for (d in days) {
                      val hc = readDay(client, granted, d, zone)
                      // use whichever is higher: the phone's own count or Health Connect (a watch may have counted more)
                      val steps = maxOf(hc.steps, Steps.forDate(ctx, d.toString()))
                      val day = hc.copy(
                          steps = steps,
                          distanceM = if (hc.distanceM > 0) hc.distanceM else Steps.distanceM(steps),
                          activeKcal = if (hc.activeKcal > 0) hc.activeKcal else Steps.kcal(steps))
                      val err = ThaliData.sendActivity(ctx, d.toString(), day)
                      if (err != null) return err
                  }
                  prefs(ctx).edit().putBoolean(yKey, true).putLong("last_sync", System.currentTimeMillis()).apply()
                  return null
              }

              private suspend fun readDay(client: HealthConnectClient, granted: Set<String>, day: LocalDate, zone: ZoneId): Day {
                  val start = day.atStartOfDay(zone).toInstant()
                  val dayEnd = day.plusDays(1).atStartOfDay(zone).toInstant()
                  val end = if (Instant.now().isBefore(dayEnd)) Instant.now() else dayEnd
                  val range = TimeRangeFilter.between(start, end)

                  var steps = 0L; var dist = 0L; var kcal = 0L
                  if (STEPS in granted) runCatching {
                      steps = client.aggregate(AggregateRequest(setOf(StepsRecord.COUNT_TOTAL), range))[StepsRecord.COUNT_TOTAL] ?: 0L
                  }
                  if (DISTANCE in granted) runCatching {
                      dist = client.aggregate(AggregateRequest(setOf(DistanceRecord.DISTANCE_TOTAL), range))[DistanceRecord.DISTANCE_TOTAL]?.inMeters?.toLong() ?: 0L
                  }
                  if (ACTIVE in granted) runCatching {
                      kcal = client.aggregate(AggregateRequest(setOf(ActiveCaloriesBurnedRecord.ACTIVE_CALORIES_TOTAL), range))[ActiveCaloriesBurnedRecord.ACTIVE_CALORIES_TOTAL]?.inKilocalories?.toLong() ?: 0L
                  }

                  // Sleep "last night": from 6 pm the evening before until 2 pm on this day
                  var sleepMin = 0L
                  if (SLEEP in granted) runCatching {
                      val sStart = day.minusDays(1).atTime(18, 0).atZone(zone).toInstant()
                      val sEnd = day.atTime(14, 0).atZone(zone).toInstant()
                      val recs = client.readRecords(ReadRecordsRequest(SleepSessionRecord::class, TimeRangeFilter.between(sStart, sEnd))).records
                      sleepMin = unionMinutes(recs.map { it.startTime to it.endTime })   // several apps may record the same night
                  }

                  var exMin = 0L; var workouts = 0
                  if (EXERCISE in granted) runCatching {
                      val recs = client.readRecords(ReadRecordsRequest(ExerciseSessionRecord::class, range)).records
                      exMin = unionMinutes(recs.map { it.startTime to it.endTime })
                      workouts = recs.map { it.startTime.epochSecond / 300 }.toSet().size   // same workout from two apps counts once
                  }
                  return Day(steps, dist, kcal, sleepMin, exMin, workouts)
              }

              private fun unionMinutes(spans: List<Pair<Instant, Instant>>): Long {
                  if (spans.isEmpty()) return 0
                  val sorted = spans.filter { it.second.isAfter(it.first) }.sortedBy { it.first }
                  var total = 0L
                  var curStart: Instant? = null
                  var curEnd: Instant? = null
                  for ((s, e) in sorted) {
                      val ce = curEnd
                      if (curStart == null || ce == null || s.isAfter(ce)) {
                          if (curStart != null && ce != null) total += Duration.between(curStart, ce).toMinutes()
                          curStart = s; curEnd = e
                      } else if (e.isAfter(ce)) curEnd = e
                  }
                  val cs = curStart; val ce = curEnd
                  if (cs != null && ce != null) total += Duration.between(cs, ce).toMinutes()
                  return total
              }
          }
          THALI_EOF

