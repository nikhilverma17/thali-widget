          cat > app/src/main/java/com/thali/widget/Steps.kt <<'THALI_EOF'
          package com.thali.widget

          import android.Manifest
          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.SystemClock
          import androidx.work.CoroutineWorker
          import androidx.work.ExistingPeriodicWorkPolicy
          import androidx.work.ExistingWorkPolicy
          import androidx.work.OneTimeWorkRequestBuilder
          import androidx.work.PeriodicWorkRequestBuilder
          import androidx.work.WorkManager
          import androidx.work.WorkerParameters
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.time.Instant
          import java.time.LocalDate
          import java.time.ZoneId
          import java.util.Calendar
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit
          import kotlin.concurrent.thread

          /**
           * Counts steps with the phone's own step sensor (TYPE_STEP_COUNTER). No other app is needed.
           *
           * The sensor is a hardware counter that keeps counting by itself (even while NutriLog is closed)
           * and only resets when the phone restarts. So NutriLog does not need to run all day: it just reads
           * the counter every 15 minutes, when you open the app, when a widget refreshes, and just after
           * midnight, and adds the difference to that day's total. Daily totals are kept on the phone and
           * also sent to NutriLog so they appear in the app and in reports.
           */
          object Steps {
              private const val PREFS = "nutrilog_steps"
              const val ACTION_MIDNIGHT = "com.thali.widget.STEPS_MIDNIGHT"
              private const val PERIODIC = "steps-periodic"
              private const val NOW = "steps-now"
              private const val KEEP_DAYS = 90L
              const val STRIDE_M = 0.75      // average adult stride, used to estimate distance
              const val KCAL_PER_STEP = 0.04 // average, used to estimate active calories
              private val lock = Any()

              private fun prefs(ctx: Context) = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              fun distanceM(steps: Long): Long = (steps * STRIDE_M).toLong()
              fun kcal(steps: Long): Long = (steps * KCAL_PER_STEP).toLong()

              fun hasSensor(ctx: Context): Boolean =
                  ctx.getSystemService(SensorManager::class.java)?.getDefaultSensor(Sensor.TYPE_STEP_COUNTER) != null

              fun hasPermission(ctx: Context): Boolean =
                  Build.VERSION.SDK_INT < 29 ||
                      ctx.checkSelfPermission(Manifest.permission.ACTIVITY_RECOGNITION) == PackageManager.PERMISSION_GRANTED

              /** active / no_permission / no_sensor, read by the widget and the web app */
              fun status(ctx: Context): String = when {
                  !hasSensor(ctx) -> "no_sensor"
                  !hasPermission(ctx) -> "no_permission"
                  else -> "active"
              }

              fun askedPermission(ctx: Context) = prefs(ctx).getBoolean("asked_permission", false)
              fun setAskedPermission(ctx: Context) { prefs(ctx).edit().putBoolean("asked_permission", true).apply() }

              fun today(): String = LocalDate.now().toString()
              fun forDate(ctx: Context, date: String): Long = prefs(ctx).getLong("d_$date", 0L)
              fun lastSample(ctx: Context): Long = prefs(ctx).getLong("raw_at", 0L)

              fun goal(ctx: Context): Int = prefs(ctx).getInt("goal", 8000)
              fun setGoal(ctx: Context, goal: Int) {
                  if (goal in 1000..50000 && goal != goal(ctx)) prefs(ctx).edit().putInt("goal", goal).apply()
              }

              /* ---------------------------------------------------------------- */
              /* Reading the sensor                                                */
              /* ---------------------------------------------------------------- */

              /**
               * Reads the step counter once and adds any new steps to today. Waits up to a few seconds,
               * so call it from a background thread (a worker, or thread { }), never the main thread.
               * Returns true when a reading was taken.
               */
              fun sample(ctx: Context, timeoutMs: Long = 5000): Boolean {
                  val app = ctx.applicationContext
                  if (!hasSensor(app) || !hasPermission(app)) return false
                  val raw = readCounter(app, timeoutMs) ?: return false
                  record(app, raw)
                  return true
              }

              private fun readCounter(ctx: Context, timeoutMs: Long): Long? {
                  val sm = ctx.getSystemService(SensorManager::class.java) ?: return null
                  val sensor = sm.getDefaultSensor(Sensor.TYPE_STEP_COUNTER) ?: return null
                  val latch = CountDownLatch(1)
                  val box = FloatArray(1) { -1f }
                  val listener = object : SensorEventListener {
                      override fun onSensorChanged(e: SensorEvent) {
                          if (latch.count > 0L) { box[0] = e.values[0]; latch.countDown() }
                      }
                      override fun onAccuracyChanged(s: Sensor?, accuracy: Int) {}
                  }
                  val ht = HandlerThread("nutrilog-steps").also { it.start() }
                  try {
                      // An on-change sensor reports its current value as soon as it is switched on
                      if (!sm.registerListener(listener, sensor, SensorManager.SENSOR_DELAY_NORMAL, Handler(ht.looper))) return null
                      latch.await(timeoutMs, TimeUnit.MILLISECONDS)
                  } finally {
                      sm.unregisterListener(listener)
                      ht.quitSafely()
                  }
                  return if (box[0] >= 0f) box[0].toLong() else null
              }

              /** Adds the steps since the previous reading to the right day. */
              private fun record(ctx: Context, raw: Long) = synchronized(lock) {
                  val p = prefs(ctx)
                  val zone = ZoneId.systemDefault()
                  val now = System.currentTimeMillis()
                  val elapsed = SystemClock.elapsedRealtime()
                  val todayDate = LocalDate.now(zone)
                  val lastRaw = p.getLong("raw", -1L)
                  val lastElapsed = p.getLong("elapsed", -1L)
                  val lastAt = p.getLong("raw_at", now)
                  val ed = p.edit()

                  fun add(date: LocalDate, n: Long) {
                      if (n > 0L) { val k = "d_$date"; ed.putLong(k, p.getLong(k, 0L) + n) }
                  }

                  if (lastRaw < 0L) {
                      // Very first reading. If the phone started today, every step since then belongs to today.
                      val bootedAt = now - elapsed
                      val startOfToday = todayDate.atStartOfDay(zone).toInstant().toEpochMilli()
                      if (bootedAt >= startOfToday) add(todayDate, raw)
                  } else {
                      // The counter starts again from zero when the phone restarts
                      val restarted = raw < lastRaw || elapsed < lastElapsed
                      val delta = if (restarted) raw else raw - lastRaw
                      val lastDate = Instant.ofEpochMilli(lastAt).atZone(zone).toLocalDate()
                      if (lastDate == todayDate || delta <= 0L) {
                          add(todayDate, delta)
                      } else {
                          // The day changed since the last reading: share the steps by how much time fell on each side of midnight
                          val midnight = todayDate.atStartOfDay(zone).toInstant().toEpochMilli()
                          val span = (now - lastAt).coerceAtLeast(1L)
                          val before = (delta * (midnight - lastAt).coerceIn(0L, span) / span)
                          add(lastDate, before)
                          add(todayDate, delta - before)
                      }
                  }
                  ed.putLong("raw", raw).putLong("elapsed", elapsed).putLong("raw_at", now)

                  // forget very old days
                  val cutoff = todayDate.minusDays(KEEP_DAYS).toString()
                  for (k in p.all.keys) {
                      val date = k.removePrefix("d_").removePrefix("sent_")
                      if ((k.startsWith("d_") || k.startsWith("sent_")) && date < cutoff) ed.remove(k)
                  }
                  ed.apply()
              }

              /* ---------------------------------------------------------------- */
              /* Sending to NutriLog                                               */
              /* ---------------------------------------------------------------- */

              /** Sends today's (and yesterday's) step totals to NutriLog when they changed. Returns an error message or null. Call off the main thread. */
              fun push(ctx: Context, force: Boolean = false): String? {
                  val app = ctx.applicationContext
                  if (!ThaliData.link(app).contains("widget=")) return "Sign in to NutriLog first"
                  val p = prefs(app)
                  val today = LocalDate.now()
                  var err: String? = null
                  for (d in listOf(today.minusDays(1), today)) {
                      val key = d.toString()
                      val n = p.getLong("d_$key", 0L)
                      if (n <= 0L) continue
                      if (!force && p.getLong("sent_$key", -1L) == n) continue
                      val e = ThaliData.sendSteps(app, key, n)
                      if (e == null) p.edit().putLong("sent_$key", n).apply() else err = e
                  }
                  return err
              }

              /* ---------------------------------------------------------------- */
              /* Scheduling                                                        */
              /* ---------------------------------------------------------------- */

              /** Starts the 15-minute step check and the after-midnight check. Safe to call again and again. */
              fun start(ctx: Context) {
                  val app = ctx.applicationContext
                  val req = PeriodicWorkRequestBuilder<StepWorker>(15, TimeUnit.MINUTES).build()
                  WorkManager.getInstance(app).enqueueUniquePeriodicWork(PERIODIC, ExistingPeriodicWorkPolicy.KEEP, req)
                  scheduleMidnight(app)
                  runNow(app)
              }

              fun runNow(ctx: Context) {
                  val req = OneTimeWorkRequestBuilder<StepWorker>().build()
                  WorkManager.getInstance(ctx.applicationContext).enqueueUniqueWork(NOW, ExistingWorkPolicy.KEEP, req)
              }

              /** A reading just after midnight, so yesterday's last steps are not counted towards the new day. */
              fun scheduleMidnight(ctx: Context) {
                  val am = ctx.getSystemService(AlarmManager::class.java) ?: return
                  val cal = Calendar.getInstance().apply {
                      add(Calendar.DAY_OF_YEAR, 1)
                      set(Calendar.HOUR_OF_DAY, 0); set(Calendar.MINUTE, 0); set(Calendar.SECOND, 20); set(Calendar.MILLISECOND, 0)
                  }
                  val pi = PendingIntent.getBroadcast(
                      ctx, 77, Intent(ctx, StepReceiver::class.java).setAction(ACTION_MIDNIGHT),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  runCatching { am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi) }
              }

              /** Reads the sensor in the background, redraws the widgets, then sends the totals. For buttons and receivers. */
              fun refreshAsync(ctx: Context, done: () -> Unit = {}) {
                  val app = ctx.applicationContext
                  thread {
                      try {
                          sample(app)
                          ThaliWidget.updateAll(app)
                          runCatching { push(app) }
                          ThaliWidget.updateAll(app)
                      } finally { done() }
                  }
              }
          }

          /** Every 15 minutes, with no need for internet: read the counter, redraw widgets, send totals when online. */
          class StepWorker(ctx: Context, params: WorkerParameters) : CoroutineWorker(ctx, params) {
              override suspend fun doWork(): Result = withContext(Dispatchers.IO) {
                  val c = applicationContext
                  Steps.sample(c)
                  Steps.scheduleMidnight(c)
                  ThaliWidget.updateAll(c)
                  runCatching { Steps.push(c) }
                  ThaliWidget.updateAll(c)
                  Result.success()
              }
          }

          /** Phone restarted, app updated, or it just turned midnight: take a reading and set the next midnight check. */
          class StepReceiver : BroadcastReceiver() {
              override fun onReceive(ctx: Context, intent: Intent) {
                  val pending = goAsync()
                  val app = ctx.applicationContext
                  thread {
                      try {
                          Steps.sample(app)
                          Steps.scheduleMidnight(app)
                          ThaliWidget.updateAll(app)
                          Steps.start(app)   // makes sure the 15-minute check is queued and sends the totals
                      } finally { pending.finish() }
                  }
              }
          }
          THALI_EOF

          cat > app/src/main/res/layout/widget_steps.xml <<'THALI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
